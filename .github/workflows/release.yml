name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run size-gate
      - run: npm test
      - run: npm run test:phase12

      - name: Pack dist for GitHub Release
        run: |
          mkdir -p release-assets
          cp -r dist release-assets/
          cd release-assets && zip -r ../lightdraw-dist.zip dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: lightdraw-dist.zip
          generate_release_notes: true
          body_path: docs/v1.2.1-release-notes.md

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret not set — skipping npm publish (publish manually after npm login)"
            exit 0
          fi
          npm publish --access public
