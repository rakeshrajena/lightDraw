name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run build

      - name: Bundle size gate
        run: npm run size-gate

      - name: Security audit (no critical production vulns)
        run: npm audit --production --audit-level=critical

      - name: Run unit & integration tests
        run: npm test -- --exclude test/perf.test.ts

      - name: Performance regression tests
        run: npm run test:perf

      - name: Coverage gate (Phase 12 ≥95%)
        run: npm run test:coverage -- --exclude test/perf.test.ts

      - name: Phase 12 release hardening tests
        run: npm run test:phase12

      - name: Documentation & playground (Phase 11)
        run: npm run test:phase11

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build website for visual tests
        run: npm run build:website

      - name: Visual regression (Chromium) + cross-browser smoke
        run: npm run test:visual

      - name: Memory tests
        run: npm run test:memory

      - name: Renderer smoke tests
        run: npm test -- test/renderers/

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build
      - run: npm run benchmark
      - name: Compare against baseline (25% tolerance)
        run: npm run benchmark:compare
