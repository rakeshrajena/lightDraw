<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LightDraw — Automotive Cluster</title>
  <script src="demo-embed.js"></script>
  <link rel="stylesheet" href="demo-common.css">
  <link rel="stylesheet" href="../lightdraw.min.css">
</head>
<body>
  <div class="demo-shell">
    <header class="demo-header">
      <span class="demo-badge">Automotive Module</span>
      <h1>Digital Instrument Cluster</h1>
      <p>Full cockpit simulation plus a <strong>160-widget</strong> automotive catalog — dials, gauges, ADAS lamps, media panels, and EV charging.</p>
    </header>
    <main class="demo-main">
      <div class="demo-view-tabs" id="view-tabs">
        <button type="button" class="demo-btn is-active" data-view="cluster">Instrument cluster</button>
        <button type="button" class="demo-btn secondary" data-view="widgets">Widget catalog (160)</button>
      </div>
      <div id="view-cluster">
        <div class="demo-toolbar">
          <button class="demo-btn" onclick="toggleDrive()">Toggle drive simulation</button>
          <button class="demo-btn secondary" onclick="randomFrame()">Random frame</button>
          <label class="demo-label">Theme
            <select class="demo-select" id="theme" onchange="setTheme(this.value)">
              <option value="classic">Classic</option>
              <option value="sport">Sport</option>
              <option value="digital">Digital</option>
            </select>
          </label>
        </div>
        <div class="demo-canvas-wrap">
          <div id="app"></div>
        </div>
      </div>
      <div class="chart-catalog-wrap" id="view-widgets" hidden>
        <div class="demo-toolbar">
          <input type="search" id="widget-search" placeholder="Filter widgets…" aria-label="Filter widgets">
          <span class="chart-count" id="widget-count"></span>
        </div>
        <div class="chart-gallery" id="widget-gallery"></div>
      </div>
    </main>
  </div>
  <script src="../lightdraw.min.js"></script>
  <script src="demo-auto-catalog.js"></script>
  <script>
    const isEmbed = () => document.documentElement.classList.contains('demo-embed');

    let driveTimer = null;
    let frameIndex = 0;
    let cluster = null;
    const frames = LightDraw.sampleDriveFrames ? LightDraw.sampleDriveFrames(120) : [];

    const clusterApp = LightDraw.createApp('#app', {
      width: 920,
      height: 420,
      background: '#0a0a0a',
      renderer: 'canvas',
      autoResize: true,
    });

    const widgetMounts = [];

    function clusterWrapSize() {
      const wrap = document.querySelector('#view-cluster .demo-canvas-wrap');
      if (!wrap) return { w: 920, h: 420 };
      return {
        w: Math.max(320, wrap.clientWidth - 8),
        h: Math.max(260, wrap.clientHeight - 8),
      };
    }

    function loadCluster(theme) {
      cluster = null;
      const { w, h } = clusterWrapSize();
      clusterApp.resize(w, h);
      clusterApp.loadJSON({
        type: 'instrumentCluster',
        props: {
          theme,
          width: w - 20,
          height: h - 20,
          x: 10,
          y: 10,
          speed: 0,
          rpm: 800,
          fuel: 75,
          engineTemp: 85,
          batteryVoltage: 12.4,
          tpms: [32, 32, 32, 32],
          gear: 'P',
          parkingBrake: true,
        },
      });
      cluster = clusterApp.stage.children[0];
    }

    loadCluster('classic');

    function applyFrame(state) {
      if (!cluster || !LightDraw.applyDriveState) return;
      LightDraw.applyDriveState(cluster, state);
    }

    function toggleDrive() {
      if (driveTimer) {
        clearInterval(driveTimer);
        driveTimer = null;
        return;
      }
      driveTimer = setInterval(() => {
        if (!frames.length) return;
        applyFrame(frames[frameIndex % frames.length]);
        frameIndex++;
      }, 100);
    }

    function randomFrame() {
      applyFrame({
        speed: Math.round(Math.random() * 140),
        rpm: Math.round(1000 + Math.random() * 5000),
        fuel: Math.round(Math.random() * 100),
        engineTemp: Math.round(70 + Math.random() * 50),
        batteryVoltage: Math.round((11.5 + Math.random() * 1.5) * 10) / 10,
        tpms: [28, 30, 22, 31].map(() => Math.round(20 + Math.random() * 15)),
        parkingBrake: Math.random() > 0.7,
        headlights: Math.random() > 0.5,
        cruiseSpeed: Math.random() > 0.6 ? 65 : 0,
        gear: ['P', 'R', 'N', 'D'][Math.floor(Math.random() * 4)],
        turnLeft: Math.random() > 0.8,
        turnRight: Math.random() > 0.8,
        signals: {
          'engine.rpm': Math.round(Math.random() * 6000),
          'vehicle.speed': Math.round(Math.random() * 120),
          'battery.voltage': 12.4,
        },
      });
    }

    function setTheme(theme) {
      const wasRunning = !!driveTimer;
      if (driveTimer) clearInterval(driveTimer);
      driveTimer = null;
      loadCluster(theme);
      if (wasRunning) toggleDrive();
    }

    function destroyWidgetGallery() {
      widgetMounts.forEach((m) => m.destroy());
      widgetMounts.length = 0;
      const gallery = document.getElementById('widget-gallery');
      if (gallery) gallery.innerHTML = '';
    }

    function mountAutoWidget(type, container) {
      let app = null;
      let lastKey = '';
      const render = () => {
        const cw = Math.max(container.clientWidth, 120);
        const ch = Math.max(container.clientHeight, 80);
        if (cw < 8 || ch < 8) return;
        const key = `${cw}x${ch}`;
        if (key === lastKey && app) return;
        lastKey = key;
        app?.destroy();
        const props = window.ldAutoProps(type, cw, ch);
        props.x = 0;
        props.y = 0;
        app = LightDraw.createApp(container, {
          renderer: 'html',
          width: cw,
          height: ch,
          background: '#0a0a0a',
          autoResize: false,
        });
        app.loadJSON({ type, props });
        app.render();
      };
      const ro = typeof ResizeObserver !== 'undefined'
        ? new ResizeObserver(() => requestAnimationFrame(render))
        : null;
      ro?.observe(container);
      requestAnimationFrame(render);
      const mount = {
        type,
        container,
        ro,
        destroy: () => {
          ro?.disconnect();
          app?.destroy();
          app = null;
        },
      };
      widgetMounts.push(mount);
      return mount;
    }

    function buildWidgetGallery(filter = '') {
      const gallery = document.getElementById('widget-gallery');
      if (!gallery) return;
      const q = filter.trim().toLowerCase();
      const catalog = window.LD_AUTO_WIDGET_CATALOG || [];
      const types = catalog.filter((t) => !q || t.toLowerCase().includes(q));
      const countEl = document.getElementById('widget-count');
      if (countEl) {
        countEl.textContent = `${types.length} widget${types.length === 1 ? '' : 's'}`;
      }

      destroyWidgetGallery();

      let i = 0;
      const batch = 6;
      function renderBatch() {
        const slice = types.slice(i, i + batch);
        if (!slice.length) return;
        slice.forEach((type) => {
          const card = document.createElement('div');
          card.className = 'chart-card';
          card.innerHTML = `
            <div class="chart-card-head">
              <h3>${type}</h3>
            </div>
            <div class="mini-canvas"></div>`;
          gallery.appendChild(card);
          try {
            mountAutoWidget(type, card.querySelector('.mini-canvas'));
          } catch (err) {
            console.warn('Widget failed:', type, err);
            card.querySelector('.mini-canvas').innerHTML =
              `<p style="color:#94a3b8;font-size:12px;padding:8px">${type}</p>`;
          }
        });
        i += batch;
        if (i < types.length) requestAnimationFrame(renderBatch);
      }
      renderBatch();
    }

    function setView(view) {
      const clusterView = document.getElementById('view-cluster');
      const widgetsView = document.getElementById('view-widgets');
      const isCluster = view === 'cluster';
      clusterView.hidden = !isCluster;
      widgetsView.hidden = isCluster;
      document.querySelectorAll('#view-tabs [data-view]').forEach((btn) => {
        btn.classList.toggle('is-active', btn.dataset.view === view);
        btn.classList.toggle('secondary', btn.dataset.view !== view);
      });
      if (!isCluster) buildWidgetGallery(document.getElementById('widget-search')?.value || '');
      if (!isEmbed()) {
        const url = new URL(location.href);
        if (view === 'widgets') url.hash = 'widgets';
        else url.hash = '';
        history.replaceState(null, '', url);
      }
    }

    document.getElementById('view-tabs').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-view]');
      if (btn) setView(btn.dataset.view);
    });

    document.getElementById('widget-search').addEventListener('input', (e) => {
      buildWidgetGallery(e.target.value);
    });

    if (location.hash === '#widgets' && !isEmbed()) {
      setView('widgets');
    }

    let clusterResizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(clusterResizeTimer);
      clusterResizeTimer = setTimeout(() => {
        if (!document.getElementById('view-cluster').hidden) {
          const theme = document.getElementById('theme')?.value || 'classic';
          const wasRunning = !!driveTimer;
          const idx = frameIndex;
          if (driveTimer) clearInterval(driveTimer);
          driveTimer = null;
          loadCluster(theme);
          frameIndex = idx;
          if (wasRunning) toggleDrive();
        }
      }, 150);
    });
  </script>
</body>
</html>
