<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LightDraw — UI Components Demo (Phase 6)</title>
  <link rel="stylesheet" href="../lightdraw.min.css">
  <style>
    body { font-family: system-ui, sans-serif; background: #f8fafc; margin: 0; color: #0f172a; }
    header { padding: 1rem 2rem; border-bottom: 1px solid #e2e8f0; background: #fff; }
    main { padding: 1rem 2rem; }
    #app { border: 1px solid #e2e8f0; border-radius: 8px; background: #fff; min-height: 560px; }
    .log { margin-top: 1rem; padding: 0.75rem; background: #1e293b; color: #e2e8f0; border-radius: 6px; font-family: monospace; font-size: 12px; max-height: 120px; overflow: auto; }
  </style>
</head>
<body>
  <header>
    <h1>LightDraw.js — Phase 6 UI Components</h1>
    <p>All 17 interactive components — click, drag, and keyboard accessible</p>
  </header>
  <main>
    <div id="app"></div>
    <div class="log" id="log">Event log…</div>
  </main>
  <script src="../lightdraw.min.js"></script>
  <script>
    const logEl = document.getElementById('log');
    function log(msg) {
      logEl.textContent = msg + '\n' + logEl.textContent.slice(0, 800);
    }

    const app = LightDraw.createApp('#app', {
      width: 900, height: 560, background: '#ffffff', renderer: 'html',
    });

    const components = [
      { type: 'button', props: { label: 'Submit', x: 20, y: 20 } },
      { type: 'slider', props: { value: 40, x: 20, y: 70, width: 180 } },
      { type: 'checkbox', props: { label: 'Agree', checked: false, x: 20, y: 110 } },
      { type: 'toggle', props: { value: true, x: 20, y: 150 } },
      { type: 'input', props: { value: 'Hello', placeholder: 'Name', x: 20, y: 190, width: 180 } },
      { type: 'textarea', props: { value: 'Notes…', x: 20, y: 240, width: 180, height: 60 } },
      { type: 'radio', props: { label: 'Option A', group: 'g1', selected: true, x: 20, y: 320 } },
      { type: 'radio', props: { label: 'Option B', group: 'g1', x: 20, y: 350 } },
      { type: 'progressBar', props: { value: 65, x: 240, y: 24, width: 160 } },
      { type: 'tabs', props: { tabs: ['Home', 'Settings', 'About'], x: 240, y: 60, width: 300 } },
      { type: 'accordion', props: { x: 240, y: 110, width: 280 } },
      { type: 'toolbar', props: { buttons: ['New', 'Edit', 'Save'], x: 240, y: 220 } },
      { type: 'table', props: { x: 240, y: 260, columns: ['Item', 'Qty'], rows: [['Apple', '3'], ['Banana', '5']] } },
      { type: 'tree', props: { x: 240, y: 360 } },
      { type: 'menu', props: { items: ['Copy', 'Paste', 'Delete'], x: 560, y: 24, open: true } },
      { type: 'tooltip', props: { text: 'Hover me', x: 560, y: 160, visible: true } },
      { type: 'statusBar', props: { segments: ['Ready', 'Ln 1', 'UTF-8'], x: 560, y: 220, width: 300 } },
      { type: 'toast', props: { message: 'Saved!', x: 560, y: 260, duration: 8000 } },
      { type: 'dialog', props: { title: 'Confirm', open: true, x: 560, y: 320, width: 280, height: 140, overlayWidth: 900, overlayHeight: 560 } },
    ];

    app.loadJSON({
      type: 'group',
      children: components.map((c) => ({ type: c.type, props: c.props })),
    });

    app.stage.children.forEach((node) => {
      ['change', 'select', 'open', 'close', 'input'].forEach((ev) => {
        node.on(ev, (e) => log(`${node.metadata?.componentType || node.type}: ${ev} ${JSON.stringify(e.value ?? e.item ?? e.index ?? '')}`));
      });
    });

    log('Scene loaded — interact with components above');
  </script>
</body>
</html>
