<!DOCTYPE html>
<html lang="en" data-site-theme="night">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LightDraw.js — Live Playground</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/lightdraw.min.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="site-body">
  <section class="hero" id="hero" aria-label="LightDraw introduction">
    <div class="hero-atmosphere" aria-hidden="true"></div>
    <div class="hero-grid" aria-hidden="true"></div>
    <div class="hero-inner">
      <p class="hero-brand">LightDraw.js</p>
      <h1 class="hero-line">Live playground</h1>
      <p class="hero-sub">
        Edit scene JSON, tweak themes, and watch every module re-render —
        core shapes through automotive clusters.
      </p>
      <div class="hero-cta">
        <a class="hero-btn" href="#theme">Open playground</a>
        <a class="hero-btn hero-btn--ghost" href="/help.html">Help</a>
        <a class="hero-btn hero-btn--ghost" href="https://github.com/rakeshrajena/lightDraw">GitHub</a>
      </div>
    </div>
    <div id="hero-canvas-host" class="hero-canvas" aria-hidden="true"></div>
  </section>

  <div class="playground" id="playground">
    <aside class="rail" aria-label="Demo catalog">
      <div class="rail-brand">
        <a href="#hero" class="rail-logo">LightDraw</a>
        <div class="rail-brand-actions">
          <button type="button" class="theme-toggle" id="btn-site-theme" data-theme="night" aria-pressed="false" title="Switch to day">
            <span class="theme-toggle-icon" aria-hidden="true"></span>
            <span data-theme-label>Night</span>
          </button>
        </div>
      </div>
      <nav class="rail-nav" id="demo-nav" role="tablist" aria-label="Demos"></nav>
      <div class="rail-foot">
        <a href="/help.html">Help</a>
        <a href="docs/getting-started.md">Docs</a>
        <a href="https://github.com/rakeshrajena/lightDraw">GitHub</a>
      </div>
    </aside>

    <div class="stage">
      <header class="stage-bar">
        <div class="stage-titles">
          <h2 id="stage-title">Theme</h2>
          <p id="stage-desc">Live Scene / Theme JSON editors with bidirectional presets.</p>
        </div>
        <div class="stage-actions">
          <span class="stage-live" id="stage-live" data-state="on" title="Demos support live Scene / Theme / API editing">
            <span class="stage-live-dot" aria-hidden="true"></span>
            Editable
          </span>
          <a class="stage-btn" id="btn-open-full" href="examples/demo-theme.html" target="_blank" rel="noopener">Open full</a>
          <button type="button" class="stage-btn stage-btn--ghost" id="btn-reload" title="Reload demo">Reload</button>
        </div>
      </header>
      <div class="stage-frame-wrap">
        <iframe
          id="demo-frame"
          class="stage-frame"
          title="LightDraw demo"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </div>
    </div>
  </div>

  <script src="/lightdraw.min.js"></script>
  <script src="/site-theme.js"></script>
  <script type="module" src="/main.js"></script>
</body>
</html>
