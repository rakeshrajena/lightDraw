<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LightDraw Playground</title>
  <link rel="stylesheet" href="/lightdraw.min.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <h1>LightDraw.js Playground</h1>
    <p>Interactive examples — Phase 11</p>
    <nav class="nav">
      <a href="#core">Core</a>
      <a href="#animation">Animation</a>
      <a href="#ui">UI</a>
      <a href="#dashboard">Dashboard</a>
      <a href="#automotive">Automotive</a>
      <a href="#diagram">Diagram</a>
      <a href="#export">Export</a>
      <a href="#a11y">A11y</a>
    </nav>
  </header>
  <main>
    <section id="core" class="panel">
      <h2>Core</h2>
      <div id="demo-core" class="canvas-host"></div>
    </section>
    <section id="animation" class="panel">
      <h2>Animation</h2>
      <iframe src="/examples/demo-animation.html" title="Animation demo" class="demo-frame"></iframe>
    </section>
    <section id="ui" class="panel">
      <h2>UI Components</h2>
      <iframe src="/examples/demo-ui.html" title="UI demo" class="demo-frame"></iframe>
    </section>
    <section id="dashboard" class="panel">
      <h2>Dashboard</h2>
      <iframe src="/examples/demo-dashboard.html" title="Dashboard demo" class="demo-frame"></iframe>
    </section>
    <section id="automotive" class="panel">
      <h2>Automotive</h2>
      <iframe src="/examples/demo-automotive.html" title="Automotive demo" class="demo-frame"></iframe>
    </section>
    <section id="diagram" class="panel">
      <h2>Diagram</h2>
      <iframe src="/examples/demo-diagram.html" title="Diagram demo" class="demo-frame"></iframe>
    </section>
    <section id="export" class="panel">
      <h2>Export</h2>
      <iframe src="/examples/demo-export.html" title="Export demo" class="demo-frame"></iframe>
    </section>
    <section id="a11y" class="panel">
      <h2>Accessibility</h2>
      <iframe src="/examples/demo-a11y.html" title="A11y demo" class="demo-frame"></iframe>
    </section>
  </main>
  <footer>
    <a href="https://github.com/lightdraw/lightdraw.js">GitHub</a> ·
    <a href="/docs/README.md">Documentation</a>
  </footer>
  <script src="/lightdraw.min.js"></script>
  <script type="module" src="/main.js"></script>
</body>
</html>
