<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LightDraw.js Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
    header { padding: 1rem 2rem; border-bottom: 1px solid #334155; }
    header h1 { font-size: 1.5rem; }
    header p { color: #94a3b8; margin-top: 0.25rem; }
    main { display: grid; grid-template-columns: 1fr 320px; gap: 1rem; padding: 1rem 2rem; }
    #app { background: #1e293b; border-radius: 8px; border: 1px solid #334155; }
    aside { background: #1e293b; border-radius: 8px; border: 1px solid #334155; padding: 1rem; }
    aside h2 { font-size: 1rem; margin-bottom: 0.75rem; }
    aside button { display: block; width: 100%; padding: 0.5rem; margin-bottom: 0.5rem; background: #2563eb; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    aside button:hover { background: #1d4ed8; }
    pre { background: #0f172a; padding: 0.75rem; border-radius: 4px; font-size: 0.75rem; overflow: auto; max-height: 200px; }
  </style>
</head>
<body>
  <header>
    <h1>LightDraw.js</h1>
    <p>Ultra-lightweight 2D graphics engine — zero dependencies</p>
  </header>
  <main>
    <div id="app"></div>
    <aside>
      <h2>Examples</h2>
      <button onclick="demoShapes()">Basic Shapes</button>
      <button onclick="demoAnimation()">Animation</button>
      <button onclick="demoDashboard()">Dashboard</button>
      <button onclick="demoAutomotive()">Automotive Cluster</button>
      <button onclick="demoTimeline()">Timeline</button>
      <h2 style="margin-top:1rem">Scene JSON</h2>
      <pre id="json-output"></pre>
    </aside>
  </main>
  <script src="../dist/lightdraw.min.js"></script>
  <script>
    let app = LightDraw.createApp('#app', { width: 800, height: 500, background: '#1e293b' });

    function clear() {
      app.destroy();
      app = LightDraw.createApp('#app', { width: 800, height: 500, background: '#1e293b' });
    }

    function showJSON() {
      document.getElementById('json-output').textContent = JSON.stringify(app.exportJSON(), null, 2);
    }

    function demoShapes() {
      clear();
      const group = app.group();
      group.add(app.rect({ x: 50, y: 50, width: 120, height: 80, fill: '#3b82f6', cornerRadius: 8 }));
      group.add(app.circle({ x: 250, y: 90, radius: 40, fill: '#ef4444' }));
      group.add(app.star({ x: 380, y: 40, numPoints: 5, innerRadius: 20, outerRadius: 45, fill: '#f59e0b' }));
      group.add(app.text({ x: 50, y: 200, text: 'LightDraw.js — Production Ready', fontSize: 24, fill: '#e2e8f0' }));
      group.add(app.line({ x: 50, y: 250, x2: 400, y2: 0, stroke: '#64748b', strokeWidth: 2 }));
      app.add(group);
      showJSON();
    }

    function demoAnimation() {
      clear();
      const circle = app.circle({ x: 100, y: 250, radius: 30, fill: '#2563eb', draggable: true });
      app.add(circle);
      circle.animate({ x: 650, duration: 2000, easing: 'easeInOutCubic', loop: true, reverse: true });
      showJSON();
    }

    function demoDashboard() {
      clear();
      app.loadJSON({
        type: 'dashboard',
        children: [
          { type: 'speedometer', props: { value: 120, size: 180, x: 50, y: 50 } },
          { type: 'gauge', props: { value: 72, size: 120, x: 280, y: 80 } },
          { type: 'lineChart', props: { data: [20, 45, 30, 60, 55, 80], width: 300, height: 120, x: 450, y: 50 } },
          { type: 'barChart', props: { data: [30, 50, 40, 70], width: 300, height: 120, x: 50, y: 280 } },
          { type: 'battery', props: { value: 85, x: 400, y: 300 } }
        ]
      });
      showJSON();
    }

    function demoAutomotive() {
      clear();
      app.loadJSON({
        type: 'instrumentCluster',
        props: { width: 800, height: 450, speed: 95, rpm: 3200, fuel: 68 },
        children: [
          { type: 'gearIndicator', props: { gear: 'D', x: 370, y: 200 } },
          { type: 'turnIndicators', props: { left: true, x: 300, y: 380 } },
          { type: 'warningLamp', props: { label: 'ABS', active: false, x: 500, y: 380 } },
          { type: 'adasStatus', props: { status: 'active', x: 600, y: 380 } }
        ]
      });
      showJSON();
    }

    function demoTimeline() {
      clear();
      const car = app.group({ x: 100, y: 200 });
      car.add(app.roundedRect({ width: 120, height: 40, fill: '#3b82f6', cornerRadius: 8 }));
      car.add(app.circle({ x: 20, y: 30, radius: 15, fill: '#1e293b' }));
      car.add(app.circle({ x: 85, y: 30, radius: 15, fill: '#1e293b' }));
      app.add(car);

      app.timeline()
        .move(car, { x: 300, duration: 800, easing: 'easeOutCubic' })
        .rotate(car, 15, 400)
        .scale(car, 1.2, 400)
        .fade(car, 0.6, 300)
        .move(car, { x: 550, duration: 600 })
        .play();
      showJSON();
    }

    demoShapes();
  </script>
</body>
</html>
