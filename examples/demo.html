<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LightDraw.js Demo</title>
  <script src="demo-embed.js"></script>
  <link rel="stylesheet" href="demo-common.css">
</head>
<body>
  <div class="demo-shell">
    <header class="demo-header">
      <span class="demo-badge">Core Engine</span>
      <h1>LightDraw.js</h1>
      <p>Ultra-lightweight 2D graphics engine — shapes, animation, dashboards, and timelines. Edit Scene JSON below for live updates.</p>
    </header>
    <main class="demo-main demo-layout-aside">
      <div class="demo-canvas-wrap">
        <div id="app"></div>
      </div>
      <aside class="demo-aside-panel">
        <h2>Examples</h2>
        <button type="button" class="demo-btn is-active" id="btn-shapes" onclick="pickDemo(this, demoShapes)">Basic Shapes</button>
        <button type="button" class="demo-btn secondary" onclick="pickDemo(this, demoAnimation)">Animation</button>
        <button type="button" class="demo-btn secondary" onclick="pickDemo(this, demoDashboard)">Dashboard</button>
        <a class="demo-aside-link" href="demo-dashboard.html">Full dashboard demo →</a>
        <button type="button" class="demo-btn secondary" onclick="pickDemo(this, demoAutomotive)">Automotive Cluster</button>
        <a class="demo-aside-link" href="demo-automotive.html">Full automotive demo →</a>
        <button type="button" class="demo-btn secondary" onclick="pickDemo(this, demoTimeline)">Timeline</button>
      </aside>
    </main>
  </div>
  <script src="../dist/lightdraw.min.js"></script>
  <script src="demo-live-playground.js"></script>
  <script>
    let app = LightDraw.createApp('#app', { width: 800, height: 500, background: '#0d1322' });
    let lastAuthorScene = null;

    function pickDemo(btn, fn) {
      document.querySelectorAll('.demo-aside-panel .demo-btn').forEach((b) => {
        b.classList.remove('is-active');
        b.classList.add('secondary');
      });
      btn.classList.add('is-active');
      btn.classList.remove('secondary');
      fn();
    }

    function clear() {
      app.destroy();
      app = LightDraw.createApp('#app', { width: 800, height: 500, background: '#0d1322' });
    }

    function syncPlayground() {
      if (window.LivePlayground) LivePlayground.syncScene(true);
    }

    function demoShapes() {
      clear();
      lastAuthorScene = {
        type: 'group',
        children: [
          { type: 'rect', props: { x: 50, y: 50, width: 120, height: 80, fill: '#3b82f6', cornerRadius: 8 } },
          { type: 'circle', props: { x: 250, y: 90, radius: 40, fill: '#ef4444' } },
          {
            type: 'star',
            props: { x: 380, y: 40, numPoints: 5, innerRadius: 20, outerRadius: 45, fill: '#f59e0b' },
          },
          {
            type: 'text',
            props: {
              x: 50,
              y: 200,
              text: 'LightDraw.js — Production Ready',
              fontSize: 24,
              fill: '#e2e8f0',
            },
          },
          { type: 'line', props: { x: 50, y: 250, x2: 400, y2: 0, stroke: '#64748b', strokeWidth: 2 } },
        ],
      };
      app.loadJSON(lastAuthorScene);
      syncPlayground();
    }

    function demoAnimation() {
      clear();
      const circle = app.circle({ x: 100, y: 250, radius: 30, fill: '#2563eb', draggable: true });
      app.add(circle);
      circle.animate({ x: 650, duration: 2000, easing: 'easeInOutCubic', loop: true, reverse: true });
      lastAuthorScene = app.exportJSON();
      syncPlayground();
    }

    function demoDashboard() {
      clear();
      lastAuthorScene = {
        type: 'dashboard',
        children: [
          { type: 'speedometer', props: { value: 120, size: 180, x: 50, y: 50 } },
          { type: 'gauge', props: { value: 72, size: 120, x: 280, y: 80 } },
          { type: 'lineChart', props: { data: [20, 45, 30, 60, 55, 80], width: 300, height: 120, x: 450, y: 50 } },
          { type: 'barChart', props: { data: [30, 50, 40, 70], width: 300, height: 120, x: 50, y: 280 } },
          { type: 'battery', props: { value: 85, x: 400, y: 300 } },
        ],
      };
      app.loadJSON(lastAuthorScene);
      syncPlayground();
    }

    function demoAutomotive() {
      clear();
      lastAuthorScene = {
        type: 'instrumentCluster',
        props: { width: 800, height: 450, speed: 95, rpm: 3200, fuel: 68 },
        children: [
          { type: 'gearIndicator', props: { gear: 'D', x: 370, y: 200 } },
          { type: 'turnIndicators', props: { left: true, x: 300, y: 380 } },
          { type: 'warningLamp', props: { label: 'ABS', active: false, x: 500, y: 380 } },
          { type: 'adasStatus', props: { status: 'active', x: 600, y: 380 } },
        ],
      };
      app.loadJSON(lastAuthorScene);
      syncPlayground();
    }

    function demoTimeline() {
      clear();
      const car = app.group({ x: 100, y: 200 });
      car.add(app.roundedRect({ width: 120, height: 40, fill: '#3b82f6', cornerRadius: 8 }));
      car.add(app.circle({ x: 20, y: 30, radius: 15, fill: '#1e293b' }));
      car.add(app.circle({ x: 85, y: 30, radius: 15, fill: '#1e293b' }));
      app.add(car);

      app.timeline()
        .move(car, { x: 300, duration: 800, easing: 'easeOutCubic' })
        .rotate(car, 15, 400)
        .scale(car, 1.2, 400)
        .fade(car, 0.6, 300)
        .move(car, { x: 550, duration: 600 })
        .play();
      lastAuthorScene = app.exportJSON();
      syncPlayground();
    }

    demoShapes();
    LivePlayground.mount({
      app: () => app,
      panes: ['scene', 'snippet'],
      getScene: () => lastAuthorScene || app.exportJSON(),
      applyScene(parsed) {
        clear();
        app.loadJSON(parsed);
        lastAuthorScene = parsed;
      },
    });
  </script>
</body>
</html>
