<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LightDraw — Dashboard</title>
  <script src="demo-embed.js"></script>
  <link rel="stylesheet" href="demo-common.css">
  <link rel="stylesheet" href="../dist/lightdraw.min.css">
</head>
<body>
  <div class="demo-shell">
    <header class="demo-header">
      <span class="demo-badge">Dashboard Module</span>
      <h1>Analytics Dashboard</h1>
      <p>Live widgets plus the full <strong>82-chart</strong> catalog — gauges, status indicators, and every dashboard chart type.</p>
    </header>
    <main class="demo-main">
      <div class="demo-view-tabs" id="view-tabs">
        <button type="button" class="demo-btn is-active" data-view="dashboard">Live dashboard</button>
        <button type="button" class="demo-btn secondary" data-view="charts">Chart catalog (82)</button>
      </div>
      <div id="view-dashboard">
      <div class="demo-toolbar" id="demo-toolbar">
        <button type="button" class="demo-btn" id="btn-random">Randomize values</button>
        <button type="button" class="demo-btn secondary" id="btn-live">Toggle live feed</button>
      </div>
      <div class="demo-canvas-wrap" id="canvas-wrap">
        <div id="app"></div>
      </div>
      </div>
      <div class="chart-catalog-wrap" id="view-charts" hidden>
        <div class="demo-toolbar">
          <input type="search" id="chart-search" placeholder="Filter charts…" aria-label="Filter charts">
          <span class="chart-count" id="chart-count"></span>
        </div>
        <div class="chart-gallery" id="chart-gallery"></div>
        <div class="chart-maximize-overlay" id="chart-maximize" hidden>
          <div class="chart-maximize-toolbar">
            <h2 id="chart-maximize-title">Chart</h2>
            <button type="button" class="demo-btn secondary" id="chart-maximize-close">Close</button>
          </div>
          <div class="chart-maximize-stage" id="chart-maximize-stage"></div>
        </div>
      </div>
    </main>
  </div>
  <script src="demo-chart-catalog.js"></script>
  <script src="../dist/lightdraw.min.js"></script>
  <script>
    const PANEL = { fill: '#151d2e', stroke: '#2a3654' };
    const isEmbed = () => document.documentElement.classList.contains('demo-embed');

    let liveTimer = null;
    let clockTimer = null;
    let app;

    function panel(x, y, w, h) {
      return {
        type: 'roundedRect',
        props: { x, y, width: w, height: h, cornerRadius: 12, fill: PANEL.fill, stroke: PANEL.stroke, strokeWidth: 1, listening: false },
      };
    }

    function widget(type, props) {
      return { type, props };
    }

    function centerIn(panelX, panelY, panelW, panelH, widgetW, widgetH) {
      return {
        x: panelX + Math.max(0, (panelW - widgetW) / 2),
        y: panelY + Math.max(0, (panelH - widgetH) / 2),
      };
    }

    function fluid(W, ratio, min, max) {
      return Math.round(Math.min(max, Math.max(min, W * ratio)));
    }

    /** Status strip — 5-across when wide, 3+2 split when narrow. */
    function addStatusStrip(children, y, pad, inner, gap, statusH) {
      const compact = inner < 640;

      if (compact) {
        const rowH = statusH;
        const col3 = (inner - gap * 2) / 3;
        const scale3 = Math.min(1.15, col3 / 52);
        const row1 = [
          { type: 'battery', props: { value: 82, scale: scale3 }, w: 44 * scale3, h: 22 * scale3 },
          { type: 'signalStrength', props: { value: 4, scale: scale3 }, w: 40 * scale3, h: 28 * scale3 },
          { type: 'meter', props: { value: 76, width: Math.max(col3 - 32, 56) }, w: Math.max(col3 - 32, 56), h: 24 },
        ];
        row1.forEach((s, i) => {
          const px = pad + i * (col3 + gap);
          const pos = centerIn(px, y, col3, rowH, s.w, s.h);
          children.push(panel(px, y, col3, rowH));
          children.push(widget(s.type, { ...s.props, x: pos.x, y: pos.y }));
        });
        y += rowH + gap;

        const col2 = (inner - gap) / 2;
        const knobSize = Math.min(col2 - 28, rowH - 12, 68);
        const clockSize = Math.min(col2 - 20, rowH - 22, 64);
        const knobPos = centerIn(pad, y, col2, rowH, knobSize, knobSize);
        const clockPos = centerIn(pad + col2 + gap, y, col2, rowH, clockSize, clockSize);
        children.push(panel(pad, y, col2, rowH), panel(pad + col2 + gap, y, col2, rowH));
        children.push(
          widget('knob', { value: 55, size: knobSize, x: knobPos.x, y: knobPos.y }),
          widget('clock', { size: clockSize, live: true, showSeconds: clockSize >= 44, x: clockPos.x, y: clockPos.y })
        );
        return y + rowH + pad;
      }

      const slotW = (inner - gap * 4) / 5;
      const scale = Math.min(1.25, Math.max(0.9, slotW / 110));
      const knobSize = Math.min(slotW - 10, statusH - 10, Math.round(60 * scale));
      const clockSize = Math.min(slotW - 8, statusH - 22, Math.round(58 * scale));
      const statusSlots = [
        { type: 'battery', props: { value: 82, scale }, w: 44 * scale, h: 22 * scale },
        { type: 'signalStrength', props: { value: 4, scale }, w: 40 * scale, h: 28 * scale },
        { type: 'meter', props: { value: 76, width: Math.max(slotW - 28, 56) }, w: Math.max(slotW - 28, 56), h: 24 },
        { type: 'knob', props: { value: 55, size: knobSize }, w: knobSize, h: knobSize },
        { type: 'clock', props: { size: clockSize, live: true, showSeconds: clockSize >= 44 }, w: clockSize, h: clockSize + 6 },
      ];
      statusSlots.forEach((s, i) => {
        const px = pad + i * (slotW + gap);
        const pos = centerIn(px, y, slotW, statusH, s.w, s.h);
        children.push(panel(px, y, slotW, statusH));
        children.push(widget(s.type, { ...s.props, x: pos.x, y: pos.y }));
      });
      return y + statusH + pad;
    }

    /** Compact embed: 2×2 gauges + charts + status strip. */
    function buildLayoutEmbed(W) {
      if (W < 520) return buildLayoutEmbedNarrow(W);

      const pad = 12;
      const gap = 12;
      const inner = W - pad * 2;
      const col = (inner - gap) / 2;
      const gaugeH = fluid(W, W < 700 ? 0.19 : 0.21, 172, 200);
      const chartH = fluid(W, 0.14, 120, 148);
      const statusH = fluid(W, 0.115, 104, 116);
      const children = [];
      let y = pad;

      const speedoSize = Math.min(Math.round(col * 0.76), col - 36, gaugeH - 32);
      const gaugeSize = Math.min(Math.round(col * 0.52), col - 40, gaugeH - 36);
      const leftGauge = centerIn(pad, y, col, gaugeH, speedoSize, speedoSize);
      const rightGauge = centerIn(pad + col + gap, y, col, gaugeH, gaugeSize, gaugeSize);
      children.push(
        panel(pad, y, col, gaugeH),
        panel(pad + col + gap, y, col, gaugeH),
        widget('speedometer', { value: 84, size: speedoSize, x: leftGauge.x, y: leftGauge.y }),
        widget('gauge', { value: 68, size: gaugeSize, x: rightGauge.x, y: rightGauge.y })
      );
      y += gaugeH + gap;

      const thermoW = 28;
      const thermoH = Math.min(gaugeH - 24, 120);
      const compassSize = Math.min(Math.round(col * 0.42), col - 44, gaugeH - 56);
      const leftThermo = centerIn(pad, y, col, gaugeH, thermoW + 36, thermoH);
      const rightCompass = centerIn(pad + col + gap, y, col, gaugeH, compassSize, compassSize + 8);
      children.push(
        panel(pad, y, col, gaugeH),
        panel(pad + col + gap, y, col, gaugeH),
        widget('thermometer', { value: 72, height: thermoH, x: leftThermo.x, y: leftThermo.y }),
        widget('compass', { heading: 128, size: compassSize, x: rightCompass.x, y: rightCompass.y })
      );
      y += gaugeH + gap;

      const lineW = Math.floor(inner * 0.58);
      const barW = inner - lineW - gap;
      const lineChartW = lineW - 24;
      const lineChartH = chartH - 28;
      const barChartW = barW - 24;
      const barChartH = chartH - 28;
      const linePos = centerIn(pad, y, lineW, chartH, lineChartW, lineChartH);
      const barPos = centerIn(pad + lineW + gap, y, barW, chartH, barChartW, barChartH);
      children.push(
        panel(pad, y, lineW, chartH),
        panel(pad + lineW + gap, y, barW, chartH),
        widget('lineChart', {
          data: [12, 28, 22, 44, 36, 58, 52],
          width: lineChartW,
          height: lineChartH,
          x: linePos.x,
          y: linePos.y,
          seriesLabel: 'Latency',
        }),
        widget('barChart', {
          data: [34, 52, 41, 68, 55],
          width: barChartW,
          height: barChartH,
          x: barPos.x,
          y: barPos.y,
        })
      );
      y += chartH + gap;

      y = addStatusStrip(children, y, pad, inner, gap, statusH);

      return { children, height: y, narrow: false, embed: true };
    }

    /** Single-column embed for narrow iframes (<520px). */
    function buildLayoutEmbedNarrow(W) {
      const pad = 12;
      const gap = 10;
      const inner = W - pad * 2;
      const children = [];
      let y = pad;

      function row(h, type, props, w, hh) {
        children.push(panel(pad, y, inner, h));
        const pos = centerIn(pad, y, inner, h, w, hh);
        children.push(widget(type, { ...props, x: pos.x, y: pos.y }));
        y += h + gap;
      }

      const speedo = Math.min(Math.round(inner * 0.42), inner - 40);
      row(fluid(W, 0.28, 168, 188), 'speedometer', { value: 84, size: speedo }, speedo, speedo);
      const gauge = Math.min(Math.round(inner * 0.34), inner - 48);
      row(fluid(W, 0.24, 148, 168), 'gauge', { value: 68, size: gauge }, gauge, gauge);
      row(140, 'thermometer', { value: 72, height: 110 }, 64, 110);
      const compass = Math.min(Math.round(inner * 0.28), inner - 56);
      row(140, 'compass', { heading: 128, size: compass }, compass, compass);
      row(132, 'lineChart', { data: [12, 28, 22, 44, 36, 58, 52], width: inner - 24, height: 96, seriesLabel: 'Latency' }, inner - 24, 96);
      row(132, 'barChart', { data: [34, 52, 41, 68, 55], width: inner - 24, height: 96 }, inner - 24, 96);
      y = addStatusStrip(children, y, pad, inner, gap, 108);

      return { children, height: y, narrow: true, embed: true };
    }

    function buildLayout(W) {
      if (isEmbed()) return buildLayoutEmbed(W);

      const pad = 12;
      const gap = 12;
      const narrow = W < 720;
      const inner = W - pad * 2;
      const children = [];
      let y = pad;

      if (narrow) {
        function nrow(h, type, props, w, hh) {
          children.push(panel(pad, y, inner, h));
          const pos = centerIn(pad, y, inner, h, w, hh);
          children.push(widget(type, { ...props, x: pos.x, y: pos.y }));
          y += h + gap;
        }
        const speedo = Math.min(168, inner - 40);
        nrow(196, 'speedometer', { value: 84, size: speedo }, speedo, speedo);
        const gauge = Math.min(130, inner - 48);
        nrow(170, 'gauge', { value: 68, size: gauge }, gauge, gauge);
        nrow(150, 'thermometer', { value: 72, height: 110 }, 64, 110);
        const compass = Math.min(100, inner - 56);
        nrow(150, 'compass', { heading: 128, size: compass }, compass, compass);
        nrow(150, 'lineChart', { data: [12, 28, 22, 44, 36, 58, 52], width: inner - 24, height: 110, seriesLabel: 'Latency' }, inner - 24, 110);
        nrow(150, 'barChart', { data: [34, 52, 41, 68, 55], width: inner - 24, height: 110 }, inner - 24, 110);
        nrow(150, 'areaChart', { data: [22, 38, 31, 52, 48, 64, 58, 71], width: inner - 24, height: 110, seriesLabel: 'Throughput' }, inner - 24, 110);
        const pie = Math.min(140, inner - 48);
        nrow(170, 'pieChart', { size: pie }, pie, pie);
        nrow(90, 'legend', { items: [{ label: 'CPU', color: '#3b82f6' }, { label: 'Memory', color: '#f59e0b' }, { label: 'Network', color: '#22c55e' }] }, inner - 48, 24);
        y = addStatusStrip(children, y, pad, inner, gap, 112);
        nrow(200, 'calendar', { width: inner - 24, height: 168, highlightDay: new Date().getDate() }, inner - 24, 168);
        nrow(180, 'timeline', { height: 140, events: [{ label: 'Deploy', time: '09:00' }, { label: 'Review', time: '12:30' }, { label: 'Release', time: '17:00' }] }, inner - 24, 140);
        return { children, height: y + pad, narrow: true };
      }

      const col = (inner - gap) / 2;
      const gaugeH = fluid(W, 0.22, 200, 224);
      const speedoSize = Math.min(Math.round(col * 0.76), col - 36, gaugeH - 32);
      const gaugeSize = Math.min(Math.round(col * 0.52), col - 40, gaugeH - 36);
      const sg = centerIn(pad, y, col, gaugeH, speedoSize, speedoSize);
      const gg = centerIn(pad + col + gap, y, col, gaugeH, gaugeSize, gaugeSize);
      children.push(
        panel(pad, y, col, gaugeH),
        panel(pad + col + gap, y, col, gaugeH),
        widget('speedometer', { value: 84, size: speedoSize, x: sg.x, y: sg.y }),
        widget('gauge', { value: 68, size: gaugeSize, x: gg.x, y: gg.y })
      );
      y += gaugeH + gap;

      const compassSize = Math.min(Math.round(col * 0.42), col - 44, gaugeH - 56);
      const thermoH = Math.min(gaugeH - 24, 120);
      const tp = centerIn(pad, y, col, gaugeH, 64, thermoH);
      const cp = centerIn(pad + col + gap, y, col, gaugeH, compassSize, compassSize + 8);
      children.push(
        panel(pad, y, col, gaugeH),
        panel(pad + col + gap, y, col, gaugeH),
        widget('thermometer', { value: 72, height: thermoH, x: tp.x, y: tp.y }),
        widget('compass', { heading: 128, size: compassSize, x: cp.x, y: cp.y })
      );
      y += gaugeH + gap;

      const chartH = fluid(W, 0.16, 148, 168);
      const lineW = Math.floor(inner * 0.58);
      const barW = inner - lineW - gap;
      const lcW = lineW - 24;
      const lcH = chartH - 28;
      const bcW = barW - 24;
      const bcH = chartH - 28;
      const lp = centerIn(pad, y, lineW, chartH, lcW, lcH);
      const bp = centerIn(pad + lineW + gap, y, barW, chartH, bcW, bcH);
      children.push(
        panel(pad, y, lineW, chartH),
        panel(pad + lineW + gap, y, barW, chartH),
        widget('lineChart', { data: [12, 28, 22, 44, 36, 58, 52], width: lcW, height: lcH, x: lp.x, y: lp.y, seriesLabel: 'Latency' }),
        widget('barChart', { data: [34, 52, 41, 68, 55], width: bcW, height: bcH, x: bp.x, y: bp.y })
      );
      y += chartH + gap;

      const row3H = chartH;
      const areaW = Math.floor(inner * 0.42);
      const pieW = Math.floor(inner * 0.28);
      const legendW = inner - areaW - pieW - gap * 2;
      const pieSize = Math.min(pieW - 32, Math.round(row3H * 0.82));
      const acW = areaW - 24;
      const acH = row3H - 28;
      const ap = centerIn(pad, y, areaW, row3H, acW, acH);
      const pp = centerIn(pad + areaW + gap, y, pieW, row3H, pieSize, pieSize);
      children.push(
        panel(pad, y, areaW, row3H),
        panel(pad + areaW + gap, y, pieW, row3H),
        panel(pad + areaW + pieW + gap * 2, y, legendW, row3H),
        widget('areaChart', { data: [22, 38, 31, 52, 48, 64, 58, 71], width: acW, height: acH, x: ap.x, y: ap.y, seriesLabel: 'Throughput' }),
        widget('pieChart', { size: pieSize, x: pp.x, y: pp.y }),
        widget('legend', { items: [{ label: 'CPU', color: '#3b82f6' }, { label: 'Memory', color: '#f59e0b' }, { label: 'Network', color: '#22c55e' }], x: pad + areaW + pieW + gap * 2 + 16, y: y + (row3H - 54) / 2 })
      );
      y += row3H + gap;

      y = addStatusStrip(children, y, pad, inner, gap, fluid(W, 0.12, 108, 120));

      const bottomH = fluid(W, 0.18, 168, 188);
      const calW = Math.floor(inner * 0.52);
      const timeW = inner - calW - gap;
      const calInnerW = calW - 24;
      const timeInnerH = bottomH - 28;
      children.push(
        panel(pad, y, calW, bottomH),
        panel(pad + calW + gap, y, timeW, bottomH),
        widget('calendar', { width: calInnerW, height: bottomH - 24, highlightDay: new Date().getDate(), x: pad + 12, y: y + 12 }),
        widget('timeline', { height: timeInnerH, x: pad + calW + gap + 12, y: y + 12, events: [{ label: 'Deploy', time: '09:00' }, { label: 'Review', time: '12:30' }, { label: 'Release', time: '17:00' }] })
      );
      y += bottomH + pad;

      return { children, height: y, narrow: false };
    }

    function auditScene() {
      const layer = app?.stage?.children?.[0];
      if (!layer?.children) return { widgetCount: 0, issues: ['no scene'] };

      const nodes = layer.children;
      const panels = nodes.filter((n) => !n.metadata?.widgetType);
      const widgets = nodes.filter((n) => n.metadata?.widgetType);
      const issues = [];

      function overlapArea(a, b) {
        const x1 = Math.max(a.x, b.x);
        const y1 = Math.max(a.y, b.y);
        const x2 = Math.min(a.x + a.width, b.x + b.width);
        const y2 = Math.min(a.y + a.height, b.y + b.height);
        if (x2 <= x1 || y2 <= y1) return 0;
        return (x2 - x1) * (y2 - y1);
      }

      function nodeBox(n) {
        if (n.metadata?.widgetType) return n.getBounds();
        const w = typeof n.width === 'number' ? n.width : n.getBounds().width;
        const h = typeof n.height === 'number' ? n.height : n.getBounds().height;
        return { x: n.x, y: n.y, width: w, height: h };
      }

      widgets.forEach((w) => {
        const wb = nodeBox(w);
        let panel = null;
        let best = 0;
        panels.forEach((p) => {
          const area = overlapArea(wb, nodeBox(p));
          if (area > best) {
            best = area;
            panel = p;
          }
        });
        if (!panel || best < 16) {
          issues.push(w.metadata.widgetType + ': outside panel');
          return;
        }
        const pb = nodeBox(panel);
        const tol = 6;
        if (wb.x < pb.x - tol) issues.push(w.metadata.widgetType + ': clip left');
        if (wb.y < pb.y - tol) issues.push(w.metadata.widgetType + ': clip top');
        if (wb.x + wb.width > pb.x + pb.width + tol) issues.push(w.metadata.widgetType + ': clip right');
        if (wb.y + wb.height > pb.y + pb.height + tol) issues.push(w.metadata.widgetType + ': clip bottom');
      });

      return {
        widgetCount: widgets.length,
        types: widgets.map((w) => w.metadata.widgetType),
        issues,
        height: app.height,
      };
    }

    function buildDashboard() {
      const wrap = document.getElementById('canvas-wrap');
      const W = Math.max(wrap.clientWidth - 8, 320);
      const layout = buildLayout(W);

      if (app) app.destroy();
      if (clockTimer) clearInterval(clockTimer);

      app = LightDraw.createApp('#app', {
        width: W,
        height: layout.height,
        background: '#0d1322',
        renderer: 'canvas',
      });

      document.getElementById('app').style.height = layout.height + 'px';
      app.loadJSON({ type: 'group', children: layout.children });
      app.render();

      clockTimer = setInterval(() => {
        const clock = findWidget('clock');
        if (clock?.metadata?.refresh) {
          clock.metadata.refresh(0);
          app.requestRender();
        }
      }, 1000);

      window.__ldDashAudit = auditScene;
    }

    function widgets() {
      const layer = app.stage.children[0];
      if (!layer?.children) return [];
      return layer.children.filter((n) => n.metadata?.widgetType);
    }

    function findWidget(type) {
      return widgets().find((n) => n.metadata.widgetType === type);
    }

    function randomize() {
      widgets().forEach((node) => {
        const t = node.metadata.widgetType;
        if (!node.metadata.refresh) return;
        if (t === 'speedometer') LightDraw.animateLiveValue(node, 'value', Math.random() * 160, 450);
        else if (t === 'gauge' || t === 'thermometer' || t === 'knob' || t === 'meter') LightDraw.animateLiveValue(node, 'value', Math.random() * 100, 450);
        else if (t === 'compass') LightDraw.animateLiveValue(node, 'heading', Math.random() * 360, 450);
        else if (t === 'battery') LightDraw.animateLiveValue(node, 'value', 20 + Math.random() * 80, 450);
        else if (t === 'signalStrength') LightDraw.animateLiveValue(node, 'value', Math.floor(Math.random() * 6), 300);
      });
    }

    function toggleLive() {
      const btn = document.getElementById('btn-live');
      if (liveTimer) {
        clearInterval(liveTimer);
        liveTimer = null;
        btn.classList.remove('is-active');
        return;
      }
      btn.classList.add('is-active');
      liveTimer = setInterval(randomize, 2000);
    }

    document.getElementById('btn-random').addEventListener('click', randomize);
    document.getElementById('btn-live').addEventListener('click', toggleLive);

    const chartApps = [];
    const chartMounts = [];

    function destroyChartGallery() {
      chartMounts.forEach((m) => {
        if (m.chart && LightDraw.detachChartResizeObserver) LightDraw.detachChartResizeObserver(m.chart);
        m.app?.destroy();
      });
      chartMounts.length = 0;
      chartApps.length = 0;
      document.getElementById('chart-gallery').innerHTML = '';
      closeChartMaximize();
    }

    function mountChart(type, container) {
      const cw = Math.max(container.clientWidth || 248, 120);
      const ch = Math.max(container.clientHeight || 128, 80);
      const chartApp = LightDraw.createApp(container, { renderer: 'html', width: cw, height: ch, autoResize: false });
      const props = window.ldChartProps(type, cw, ch);
      const root = chartApp.loadJSON({ type, props });
      chartApp.render();
      const chart = root?.metadata?.widgetType ? root : root?.children?.find((n) => n.metadata?.widgetType);
      if (chart && LightDraw.installChartResizeObserver) {
        LightDraw.installChartResizeObserver(chart, container, { minWidth: 100, minHeight: 72 });
      }
      chartApps.push(chartApp);
      return { app: chartApp, chart, type, container };
    }
    let maximizeMount = null;

    function openChartMaximize(type) {
      const overlay = document.getElementById('chart-maximize');
      const stage = document.getElementById('chart-maximize-stage');
      document.getElementById('chart-maximize-title').textContent = type;
      overlay.hidden = false;
      stage.innerHTML = '';
      document.body.style.overflow = 'hidden';

      requestAnimationFrame(() => {
        const w = Math.max(stage.clientWidth || 320, 320);
        const h = Math.max(stage.clientHeight || 240, 240);
        const chartApp = LightDraw.createApp(stage, { renderer: 'html', width: w, height: h, autoResize: true });
        const props = window.ldChartProps(type, w, h);
        const root = chartApp.loadJSON({ type, props });
        chartApp.render();
        const chart = root?.metadata?.widgetType ? root : root?.children?.find((n) => n.metadata?.widgetType);
        if (chart && LightDraw.installChartResizeObserver) {
          LightDraw.installChartResizeObserver(chart, stage, { minWidth: 200, minHeight: 160 });
        }
        maximizeMount = { app: chartApp, chart, type };
      });
    }

    function closeChartMaximize() {
      const overlay = document.getElementById('chart-maximize');
      if (maximizeMount?.chart && LightDraw.detachChartResizeObserver) {
        LightDraw.detachChartResizeObserver(maximizeMount.chart);
      }
      maximizeMount?.app?.destroy();
      maximizeMount = null;
      if (overlay) overlay.hidden = true;
      const stage = document.getElementById('chart-maximize-stage');
      if (stage) stage.innerHTML = '';
      document.body.style.overflow = '';
    }

    document.getElementById('chart-maximize-close').addEventListener('click', closeChartMaximize);
    document.getElementById('chart-maximize').addEventListener('click', (e) => {
      if (e.target.id === 'chart-maximize') closeChartMaximize();
    });

    function buildChartGallery(filter = '') {
      const gallery = document.getElementById('chart-gallery');
      const q = filter.trim().toLowerCase();
      const types = (window.LD_CHART_CATALOG || []).filter((t) => !q || t.toLowerCase().includes(q));
      document.getElementById('chart-count').textContent = `${types.length} chart${types.length === 1 ? '' : 's'}`;

      destroyChartGallery();

      let i = 0;
      const batch = 6;
      function renderBatch() {
        const slice = types.slice(i, i + batch);
        if (!slice.length) return;
        slice.forEach((type) => {
          const card = document.createElement('div');
          card.className = 'chart-card';
          card.innerHTML = `
            <div class="chart-card-head">
              <h3>${type}</h3>
              <div class="chart-card-actions">
                <button type="button" title="Maximize" data-maximize="${type}">⤢</button>
              </div>
            </div>
            <div class="mini-canvas"></div>`;
          gallery.appendChild(card);
          card.querySelector('[data-maximize]').addEventListener('click', () => openChartMaximize(type));
          try {
            const mount = mountChart(type, card.querySelector('.mini-canvas'));
            chartMounts.push(mount);
          } catch (err) {
            console.warn('Chart failed:', type, err);
          }
        });
        i += batch;
        if (i < types.length) requestAnimationFrame(renderBatch);
      }
      renderBatch();
    }

    function setView(view) {
      const dash = document.getElementById('view-dashboard');
      const charts = document.getElementById('view-charts');
      const isDash = view === 'dashboard';
      dash.hidden = !isDash;
      charts.hidden = isDash;
      document.querySelectorAll('#view-tabs [data-view]').forEach((btn) => {
        const active = btn.dataset.view === view;
        btn.classList.toggle('is-active', active);
        btn.classList.toggle('secondary', !active);
      });
      if (!isDash) buildChartGallery(document.getElementById('chart-search').value);
      if (isDash && app) app.requestRender();
      if (!isEmbed()) {
        const url = new URL(location.href);
        if (view === 'charts') url.hash = 'charts';
        else url.hash = '';
        history.replaceState(null, '', url);
      }
    }

    document.getElementById('view-tabs').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-view]');
      if (!btn) return;
      setView(btn.dataset.view);
    });

    document.getElementById('chart-search').addEventListener('input', (e) => {
      buildChartGallery(e.target.value);
    });

    buildDashboard();
    if (location.hash === '#charts' && !isEmbed()) {
      setView('charts');
    }

    window.addEventListener('resize', () => {
      clearTimeout(window._ldDashResize);
      window._ldDashResize = setTimeout(() => {
        if (!document.getElementById('view-dashboard').hidden) buildDashboard();
        else if (maximizeMount?.app) {
          const stage = document.getElementById('chart-maximize-stage');
          maximizeMount.app.resize(stage.clientWidth, stage.clientHeight);
        }
      }, 150);
    });
  </script>
</body>
</html>
