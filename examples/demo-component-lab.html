  <script src="demo-embed.js"></script>
  <link rel="stylesheet" href="demo-common.css">
  <link rel="stylesheet" href="../dist/lightdraw.min.css">

<body>
  <div class="demo-shell">
    <header class="demo-header">
      <span class="demo-badge">Component Lab</span>
      <h1>Pick a component · live preview · edit JSON / API</h1>
      <p>Select a family and component. Only that component renders. Edit JSON or API code below for a live update.</p>
    </header>
    <main class="demo-main lab-main">
      <div class="lab-layout">
        <aside class="lab-picker" aria-label="Component picker">
          <label class="lab-field">
            <span>Family</span>
            <select id="lab-family"></select>
          </label>
          <label class="lab-field">
            <span>Category</span>
            <select id="lab-category"></select>
          </label>
          <label class="lab-field">
            <span>Search</span>
            <input id="lab-search" type="search" placeholder="Filter components…" autocomplete="off">
          </label>
          <label class="lab-field lab-field--list">
            <span>Component</span>
            <div class="lab-component-scroller">
              <select id="lab-component" size="12" aria-label="Component"></select>
            </div>
          </label>
        </aside>

        <div class="lab-stage">
          <article class="lab-docs" id="lab-docs" aria-live="polite">
            <div class="lab-docs__eyebrow" id="lab-eyebrow">Family</div>
            <h2 id="lab-title">Component</h2>
            <p id="lab-definition">Definition</p>
            <p class="lab-docs__use"><strong>Where to use:</strong> <span id="lab-where">—</span></p>
            <p class="lab-docs__api"><strong>API:</strong> <code id="lab-api">—</code></p>
          </article>
          <div class="demo-canvas-wrap lab-canvas-wrap" id="lab-canvas-wrap">
            <div id="app"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

    function measure() {
      const w = Math.max(320, Math.floor((wrap.clientWidth || 640) - 8));
      const h = Math.max(240, Math.floor((wrap.clientHeight || 320) - 8));
      return { width: w, height: h };
    }

    function ensureApp() {
      const { width, height } = measure();
      if (!app) {
        app = LightDraw.createApp('#app', {
          width,
          height,
          background: '#0d1322',
          renderer: 'canvas',
          uiTheme: { preset: 'dark' },
        });
        return app;
      }
      if (typeof app.resize === 'function') app.resize(width, height);
      else {
        app.width = width;
        app.height = height;
      }
      return app;
    }

    function humanize(id) {
      return String(id)
        .replace(/([a-z])([A-Z])/g, '$1 $2')
        .replace(/[_-]+/g, ' ')
        .replace(/\b\w/g, (c) => c.toUpperCase());
    }

          label: it.label,

          kind: 'json',
          scene: { type: 'group', theme: { preset: 'dark' }, children: [{ type: it.id, props: it.props }] },
          snippet: jsonSnippet({ type: it.id, props: it.props }),
        })),
        dashboard: [...new Set(dashboardTypes)].sort().map((id) => {
          const docs = DASHBOARD_DOCS[id] || {
            definition: humanize(id) + ' dashboard widget.',
            where: 'Analytics and monitoring boards.',
          };
          const props = defaultDashboardProps(id);
          return {
            family: 'dashboard',
            category: /Chart|Plot|heatmap|treemap|sankey|gantt|histogram|radar|pie|doughnut/i.test(id) ? 'charts' : 'widgets',
            id,
            label: humanize(id),
            definition: docs.definition,
            where: docs.where,
            api: `app.loadJSON({ type: '${id}', props: { … } })`,
            kind: 'json',
            scene: { type: 'group', theme: { preset: 'dark' }, children: [{ type: id, props }] },
            snippet: jsonSnippet({ type: id, props }),
          };
        }),
        automotive: AUTOMOTIVE_ITEMS.map((it) => ({
          family: 'automotive',
          category: 'all',
          id: it.id,
          label: it.label,
          definition: it.definition,
          where: it.where,
          api: `app.loadJSON({ type: '${it.id}', props: { … } })`,
          kind: 'json',
          scene: { type: 'group', theme: { automotive: 'sport' }, children: [{ type: it.id, props: it.props }] },
          snippet: jsonSnippet({ type: it.id, props: it.props }),
        })),
        diagram: DIAGRAM_ITEMS.map((it) => ({
          family: 'diagram',
          category: 'all',
          id: it.id,
          label: it.label,
          definition: it.definition,
          where: it.where,
          api: `LightDraw.Diagram.fromJSON('${it.id}', props, app)`,
          kind: 'diagram',
          scene: it.scene,
          snippet:
            `// Editable API — Run or Ctrl/Cmd+Enter\n` +
            `const scene = ${JSON.stringify(it.scene, null, 2)};\n` +
            `app.clear();\n` +
            `const node = LightDraw.Diagram.fromJSON(scene.type, scene.props, app);\n` +
            `if (node) app.add(node);\n`,
        })),
        shapes: SHAPE_ITEMS.map((it) => ({
          family: 'shapes',
          category: 'all',
          id: it.id,
          label: it.label,
          definition: it.definition,
          where: it.where,
          api: `app.loadJSON({ type: '${it.id}', props: { … } })`,
          kind: 'json',
          scene: { type: 'group', children: [{ type: it.id, props: it.props }] },
          snippet: jsonSnippet({ type: it.id, props: it.props }),
        })),
        pipeline: [],
        schematic: [],
        network: [],
      };

      const D = LightDraw.Diagram || {};
      if (typeof D.listPipelineSymbols === 'function') {
        itemsByFamily.pipeline = D.listPipelineSymbols().map((meta) => ({
          family: 'pipeline',
          category: meta.category,
          id: meta.kind,
          label: meta.label,
          definition: `Pipeline / process symbol “${meta.label}” (${meta.category}).`,
          where: 'Process maps, CI/CD stages, manufacturing value streams.',
          api: `LightDraw.Diagram.pipelineSymbol(app, '${meta.kind}', x, y, label)`,
          kind: 'pipelineSymbol',
          scene: {
            lab: 'pipelineSymbol',
            type: meta.kind,
            label: meta.label,
            x: 80,
            y: 60,
          },
          snippet:
            `// Editable API — Run or Ctrl/Cmd+Enter\n` +
            `app.clear();\n` +
            `const node = LightDraw.Diagram.pipelineSymbol(app, '${meta.kind}', 80, 60, '${meta.label.replace(/'/g, "\\'")}');\n` +
            `app.add(node);\n`,
        }));
      }
      if (typeof D.listSchematicSymbols === 'function') {
        itemsByFamily.schematic = D.listSchematicSymbols().map((meta) => ({
          family: 'schematic',
          category: meta.category,
          id: meta.kind,
          label: meta.label,
          definition: `Electronic schematic symbol “${meta.label}” (${meta.category}).`,
          where: 'Circuit diagrams and electronics documentation.',
          api: `LightDraw.Diagram.schematicSymbol(app, '${meta.kind}', x, y, label)`,
          kind: 'schematicSymbol',
          scene: {
            lab: 'schematicSymbol',
            type: meta.kind,
            label: meta.label,
            x: 80,
            y: 60,
          },
          snippet:
            `// Editable API — Run or Ctrl/Cmd+Enter\n` +
            `app.clear();\n` +
            `const node = LightDraw.Diagram.schematicSymbol(app, '${meta.kind}', 80, 60, '${meta.label.replace(/'/g, "\\'")}');\n` +
            `app.add(node);\n`,
        }));
      }
      if (typeof D.listNetworkIcons === 'function') {
        itemsByFamily.network = D.listNetworkIcons().map((meta) => ({
          family: 'network',
          category: meta.category,
          id: meta.kind,
          label: meta.label,
          definition: `Network topology icon “${meta.label}” (${meta.category}).`,
          where: 'Network / cloud / security architecture diagrams.',
          api: `LightDraw.Diagram.networkNode(app, '${meta.label}', '${meta.kind}')`,
          kind: 'networkNode',
          scene: {
            lab: 'networkNode',
            type: meta.kind,
            label: meta.label,
            x: 100,
            y: 70,
          },
          snippet:
            `// Editable API — Run or Ctrl/Cmd+Enter\n` +
            `app.clear();\n` +
            `const node = LightDraw.Diagram.networkNode(app, '${meta.label.replace(/'/g, "\\'")}', '${meta.kind}');\n` +
            `node.x = 100; node.y = 70;\n` +
            `app.add(node);\n`,
        }));
      }
    }

    function jsonSnippet(node) {
      return (
        `// Editable API — Run or Ctrl/Cmd+Enter\n` +
        `app.clear();\n` +
        `app.loadJSON({\n` +
        `  type: 'group',\n` +
        `  theme: { preset: 'dark' },\n` +
        `  children: [\n` +
        `    ${JSON.stringify(node, null, 2).split('\n').join('\n    ')}\n` +
        `  ],\n` +
        `});\n`
      );
    }

    function applyLabScene(scene) {
      const a = ensureApp();
      a.clear();
      if (!scene || typeof scene !== 'object') throw new Error('Invalid scene JSON');

      if (scene.lab === 'pipelineSymbol') {
        const node = LightDraw.Diagram.pipelineSymbol(a, scene.type, scene.x || 80, scene.y || 60, scene.label);
        a.add(node);
        return;
      }
      if (scene.lab === 'schematicSymbol') {
        const node = LightDraw.Diagram.schematicSymbol(a, scene.type, scene.x || 80, scene.y || 60, scene.label);
        a.add(node);
        return;
      }
      if (scene.lab === 'networkNode') {
        const node = LightDraw.Diagram.networkNode(a, scene.label || scene.type, scene.type);
        node.x = scene.x || 100;
        node.y = scene.y || 70;
        a.add(node);
        return;
      }
      if (scene.type && scene.props && !scene.children) {
        // Diagram root JSON { type, props }
        const node = LightDraw.Diagram.fromJSON(scene.type, scene.props || {}, a);
        if (!node) throw new Error('Unknown diagram type: ' + scene.type);
        a.add(node);
        return;
      }
      a.loadJSON(scene);
    }

    function fillSelect(sel, options, selected) {
      sel.innerHTML = '';
      options.forEach((opt) => {
        const o = document.createElement('option');
        o.value = opt.value;
        o.textContent = opt.label;
        if (opt.value === selected) o.selected = true;
        sel.appendChild(o);
      });
    }

    function currentFamily() {
      return document.getElementById('lab-family').value;
    }

    function filteredItems() {
      const family = currentFamily();
      const cat = document.getElementById('lab-category').value;
      const q = (document.getElementById('lab-search').value || '').trim().toLowerCase();
      let items = itemsByFamily[family] || [];
      if (cat && cat !== 'all') items = items.filter((it) => it.category === cat);
      if (q) {
        items = items.filter(
          (it) =>
            it.id.toLowerCase().includes(q) ||
            it.label.toLowerCase().includes(q) ||
            (it.definition || '').toLowerCase().includes(q)
        );
      }
      return items;
    }

    function refreshCategories() {
      const family = currentFamily();
      const items = itemsByFamily[family] || [];
      const cats = ['all', ...new Set(items.map((it) => it.category).filter(Boolean))];
      const catSel = document.getElementById('lab-category');
      const prev = catSel.value || 'all';
      fillSelect(
        catSel,
        cats.map((c) => ({ value: c, label: c === 'all' ? 'All categories' : humanize(c) })),
        cats.includes(prev) ? prev : 'all'
      );
      catSel.disabled = cats.length <= 1;
    }

    function refreshComponents(keepId) {
      const items = filteredItems();
      const sel = document.getElementById('lab-component');
      const want = keepId && items.some((it) => it.id === keepId) ? keepId : items[0] && items[0].id;
      fillSelect(
        sel,
        items.map((it) => ({ value: it.id, label: it.label + '  ·  ' + it.id })),
        want
      );
      if (want) selectComponent(want);
      else updateDocs(null);
    }

    function findEntry(id) {
      const items = filteredItems();
      return items.find((it) => it.id === id) || (itemsByFamily[currentFamily()] || []).find((it) => it.id === id);
    }

    function updateDocs(entry) {
      const fam = FAMILY_META[currentFamily()] || { label: currentFamily(), blurb: '', use: '' };
      document.getElementById('lab-eyebrow').textContent = fam.label + (entry && entry.category && entry.category !== 'all' ? ' · ' + humanize(entry.category) : '');
      document.getElementById('lab-title').textContent = entry ? entry.label : 'Select a component';
      document.getElementById('lab-definition').textContent = entry
        ? entry.definition
        : fam.blurb;
      document.getElementById('lab-where').textContent = entry ? entry.where : fam.use;
      document.getElementById('lab-api').textContent = entry ? entry.api : '—';
    }

    function selectComponent(id) {
      const entry = findEntry(id);
      currentEntry = entry || null;
      updateDocs(entry);
      if (!entry) return;
      lastAuthorScene = entry.scene;
      try {
        applyLabScene(entry.scene);
        if (window.LivePlayground) {
          LivePlayground.syncScene(true);
          if (typeof LivePlayground.setSnippet === 'function') {
            LivePlayground.setSnippet(entry.snippet);
          } else {
            const el = document.getElementById('pg-editor-snippet');
            if (el) el.value = entry.snippet;
          }
        }
      } catch (err) {
        console.error(err);
        const status = document.getElementById('pg-code-status');
        if (status) {
          status.textContent = 'Render: ' + (err && err.message ? err.message : err);
          status.dataset.tone = 'err';
        }
      }
    }

    function bootPicker() {
      fillSelect(
        document.getElementById('lab-family'),
        Object.keys(FAMILY_META).map((k) => ({ value: k, label: FAMILY_META[k].label })),
        'ui'
      );
      refreshCategories();
      refreshComponents('button');

      document.getElementById('lab-family').addEventListener('change', () => {
        document.getElementById('lab-search').value = '';
        refreshCategories();
        refreshComponents();
      });
      document.getElementById('lab-category').addEventListener('change', () => refreshComponents());
      document.getElementById('lab-search').addEventListener('input', () => refreshComponents(document.getElementById('lab-component').value));
      document.getElementById('lab-component').addEventListener('change', (e) => selectComponent(e.target.value));
    }

    function boot() {
      buildCatalog();
      ensureApp();
      bootPicker();
      LivePlayground.mount({
        app: () => app,
        panes: ['scene', 'snippet'],
        getScene: () => lastAuthorScene,
        applyScene(parsed) {
          applyLabScene(parsed);
          lastAuthorScene = parsed;
        },
        getSnippet(scene) {
          if (currentEntry && currentEntry.snippet) return currentEntry.snippet;
          return (
            `// Editable API\n` +
            `app.clear();\n` +
            `app.loadJSON(${JSON.stringify(scene || { type: 'group', children: [] }, null, 2)});\n`
          );
        },
        applySnippet(code) {
          const runner = new Function('LightDraw', 'app', 'applyLabScene', '"use strict";\n' + code);
          runner(LightDraw, ensureApp(), applyLabScene);
        },
      });
    }

    if (document.readyState === 'complete') boot();
    else window.addEventListener('load', boot, { once: true });

    window.addEventListener('resize', () => {
      clearTimeout(window._labResize);
      window._labResize = setTimeout(() => {
        ensureApp();
        if (lastAuthorScene) {
          try {
            applyLabScene(lastAuthorScene);
          } catch (_) {
            /* ignore */
          }
        }
      }, 150);
    });
  </script>
</body>
</html>
