<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LightDraw — Export</title>
  <script src="demo-embed.js"></script>
  <link rel="stylesheet" href="demo-common.css">
  <link rel="stylesheet" href="../dist/lightdraw.min.css">
</head>
<body>
  <div class="demo-shell">
    <header class="demo-header">
      <span class="demo-badge">Export Pipeline</span>
      <h1>Scene Export</h1>
      <p>PNG, JPEG, SVG, PDF, JSON, and offline HTML via unified <code>app.export()</code>. Edit Scene JSON below for live updates.</p>
    </header>
    <main class="demo-main demo-layout-aside">
      <div class="demo-canvas-wrap">
        <div id="app"></div>
      </div>
      <aside class="demo-aside-panel">
        <h3>Download</h3>
        <button type="button" class="demo-btn" onclick="doExport('png')">PNG (Hi-DPI)</button>
        <button type="button" class="demo-btn secondary" onclick="doExport('jpeg')">JPEG</button>
        <button type="button" class="demo-btn secondary" onclick="doExport('svg')">SVG</button>
        <button type="button" class="demo-btn secondary" onclick="doExport('pdf')">PDF</button>
        <button type="button" class="demo-btn secondary" onclick="doExport('json')">JSON</button>
        <button type="button" class="demo-btn secondary" onclick="doExport('html')">HTML</button>
        <label>JPEG quality <input type="range" id="quality" min="0.1" max="1" step="0.05" value="0.92"></label>
        <label>Pixel ratio <input type="number" id="pixelRatio" min="1" max="3" value="2"></label>
        <label><input type="checkbox" id="cropRegion"> Crop to blue rect</label>
        <label><input type="checkbox" id="validateJson" checked> Validate JSON</label>
        <p id="status" class="demo-aside-hint" style="border-top:none;padding-top:0;margin-top:0.5rem">Ready</p>
      </aside>
    </main>
  </div>
  <script src="../dist/lightdraw.min.js"></script>
  <script src="demo-live-playground.js"></script>
  <script>
    const app = LightDraw.createApp('#app', {
      width: 680,
      height: 400,
      background: '#0d1322',
      renderer: 'canvas',
      pixelRatio: 2,
    });

    let lastAuthorScene = {
      type: 'group',
      children: [
        {
          type: 'roundedRect',
          props: { x: 40, y: 40, width: 100, height: 60, cornerRadius: 8, fill: '#dc2626' },
        },
        {
          type: 'rect',
          id: 'export-target',
          props: {
            x: 120,
            y: 80,
            width: 200,
            height: 120,
            fill: '#2563eb',
            stroke: '#93c5fd',
            strokeWidth: 2,
          },
        },
        {
          type: 'text',
          props: {
            text: 'Export Demo',
            x: 250,
            y: 280,
            fontSize: 28,
            fill: '#e2e8f0',
            fontWeight: 'bold',
          },
        },
        {
          type: 'circle',
          props: { x: 580, y: 100, radius: 50, fill: '#22c55e' },
        },
      ],
    };

    let target = null;

    function findExportTarget() {
      const root = app.stage;
      if (root && typeof root.getChildById === 'function') {
        return root.getChildById('export-target');
      }
      const layer = app.stage?.children?.[0];
      const nodes = layer?.children || [];
      return nodes.find((n) => n.id === 'export-target') || null;
    }

    function loadAuthorScene(scene) {
      app.clear();
      app.loadJSON(scene);
      lastAuthorScene = scene;
      target = findExportTarget();
      app.render();
    }

    loadAuthorScene(lastAuthorScene);

    LivePlayground.mount({
      app: () => app,
      panes: ['scene', 'snippet'],
      getScene: () => lastAuthorScene,
      applyScene(parsed) {
        loadAuthorScene(parsed);
      },
    });

    function setStatus(msg) {
      document.getElementById('status').textContent = msg;
    }

    function doExport(format) {
      try {
        const options = {
          format,
          quality: parseFloat(document.getElementById('quality').value),
          pixelRatio: parseInt(document.getElementById('pixelRatio').value, 10),
          validate: document.getElementById('validateJson').checked,
          region: document.getElementById('cropRegion').checked ? target : undefined,
          pages: format === 'pdf' ? 1 : undefined,
        };
        const result = app.export(options);
        const name = 'lightdraw-export.' + format;

        let blob;
        if (typeof result.data === 'string') {
          if (result.data.startsWith('data:')) {
            const b = atob(result.data.split(',')[1]);
            const arr = new Uint8Array(b.length);
            for (let i = 0; i < b.length; i++) arr[i] = b.charCodeAt(i);
            blob = new Blob([arr], { type: result.mimeType });
          } else {
            blob = new Blob([result.data], { type: result.mimeType });
          }
        } else if (result.data instanceof Uint8Array) {
          blob = new Blob([result.data], { type: result.mimeType });
        } else {
          blob = new Blob([JSON.stringify(result.data, null, 2)], { type: result.mimeType });
        }

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = name;
        a.click();
        URL.revokeObjectURL(url);
        setStatus('Downloaded ' + name + (result.width ? ' (' + result.width + '×' + result.height + ')' : ''));
      } catch (e) {
        setStatus('Error: ' + e.message);
      }
    }
  </script>
</body>
</html>
