<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LightDraw — Export Demo (Phase 10)</title>
  <link rel="stylesheet" href="../dist/lightdraw.min.css">
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; }
    header { padding: 1rem 2rem; border-bottom: 1px solid #334155; }
    main { padding: 1rem 2rem; display: grid; grid-template-columns: 1fr 280px; gap: 1rem; }
    #app { border: 1px solid #334155; border-radius: 8px; min-height: 400px; background: #111827; }
    .panel { background: #1e293b; border-radius: 8px; padding: 1rem; }
    .panel button { display: block; width: 100%; margin-bottom: 0.5rem; padding: 0.5rem; background: #2563eb; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    .panel button:hover { background: #1d4ed8; }
    .panel label { font-size: 0.85rem; color: #94a3b8; display: block; margin: 0.5rem 0 0.25rem; }
    .panel input, .panel select { width: 100%; padding: 0.35rem; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: #e2e8f0; }
    #status { margin-top: 1rem; font-size: 0.85rem; color: #94a3b8; }
  </style>
</head>
<body>
  <header>
    <h1>LightDraw.js — Phase 10 Export Pipeline</h1>
    <p>PNG · JPEG · SVG · PDF · JSON · HTML — unified <code>app.export()</code></p>
  </header>
  <main>
    <div id="app"></div>
    <div class="panel">
      <h3>Download</h3>
      <button onclick="doExport('png')">PNG (Hi-DPI)</button>
      <button onclick="doExport('jpeg')">JPEG</button>
      <button onclick="doExport('svg')">SVG file</button>
      <button onclick="doExport('pdf')">PDF</button>
      <button onclick="doExport('json')">JSON</button>
      <button onclick="doExport('html')">HTML (offline scene)</button>
      <label>JPEG quality <input type="range" id="quality" min="0.1" max="1" step="0.05" value="0.92"></label>
      <label>Pixel ratio <input type="number" id="pixelRatio" min="1" max="3" value="2"></label>
      <label><input type="checkbox" id="cropRegion"> Crop to blue rect</label>
      <label><input type="checkbox" id="validateJson" checked> Validate JSON</label>
      <p id="status">Ready</p>
    </div>
  </main>
  <script src="../dist/lightdraw.min.js"></script>
  <script>
    const app = LightDraw.createApp('#app', {
      width: 700, height: 400, background: '#111827', renderer: 'canvas', pixelRatio: 2,
    });

    const target = app.rect({ x: 120, y: 80, width: 200, height: 120, fill: '#2563eb', stroke: '#93c5fd', strokeWidth: 2 });
    app.add(
      app.roundedRect({ x: 40, y: 40, width: 100, height: 60, cornerRadius: 8, fill: '#dc2626' }),
      target,
      app.text({ text: 'Export Demo', x: 250, y: 280, fontSize: 28, fill: '#e2e8f0', fontWeight: 'bold' }),
      app.circle({ x: 580, y: 100, radius: 50, fill: '#22c55e' })
    );
    app.render();

    function setStatus(msg) { document.getElementById('status').textContent = msg; }

    function doExport(format) {
      try {
        const options = {
          format,
          quality: parseFloat(document.getElementById('quality').value),
          pixelRatio: parseInt(document.getElementById('pixelRatio').value, 10),
          validate: document.getElementById('validateJson').checked,
          region: document.getElementById('cropRegion').checked ? target : undefined,
          pages: format === 'pdf' ? 1 : undefined,
        };
        const result = app.export(options);
        const ext = format;
        const name = 'lightdraw-export.' + ext;

        let blob;
        if (typeof result.data === 'string') {
          if (result.data.startsWith('data:')) {
            const b = atob(result.data.split(',')[1]);
            const arr = new Uint8Array(b.length);
            for (let i = 0; i < b.length; i++) arr[i] = b.charCodeAt(i);
            blob = new Blob([arr], { type: result.mimeType });
          } else {
            blob = new Blob([result.data], { type: result.mimeType });
          }
        } else if (result.data instanceof Uint8Array) {
          blob = new Blob([result.data], { type: result.mimeType });
        } else {
          blob = new Blob([JSON.stringify(result.data, null, 2)], { type: result.mimeType });
        }

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = name;
        a.click();
        URL.revokeObjectURL(url);
        setStatus('Downloaded ' + name + (result.width ? ' (' + result.width + '×' + result.height + ')' : ''));
      } catch (e) {
        setStatus('Error: ' + e.message);
      }
    }
  </script>
</body>
</html>
