<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LightDraw — Accessibility Demo (Phase 4)</title>
  <link rel="stylesheet" href="../dist/lightdraw.min.css">
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; }
    header { padding: 1rem 2rem; border-bottom: 1px solid #334155; }
    main { display: grid; grid-template-columns: 1fr 260px; gap: 1rem; padding: 1rem 2rem; }
    #app { border-radius: 8px; border: 1px solid #334155; min-height: 480px; }
    aside { background: #1e293b; border-radius: 8px; border: 1px solid #334155; padding: 1rem; }
    aside button { display: block; width: 100%; padding: 0.5rem; margin-bottom: 0.5rem; background: #2563eb; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    aside p { font-size: 0.8rem; color: #94a3b8; line-height: 1.5; }
    kbd { background: #334155; padding: 0.1rem 0.35rem; border-radius: 3px; font-size: 0.75rem; }
  </style>
</head>
<body>
  <header>
    <h1>LightDraw.js — Phase 4 Accessibility</h1>
    <p>Keyboard navigation · ARIA · drag-drop · high contrast</p>
  </header>
  <main>
    <div id="app"></div>
    <aside>
      <p>Use <kbd>Tab</kbd> / <kbd>Shift+Tab</kbd> to move focus.<br>
         <kbd>Enter</kbd> or <kbd>Space</kbd> activates buttons.<br>
         Drag the blue chip onto the green zone.</p>
      <button onclick="toggleContrast()">Toggle High Contrast</button>
      <button onclick="resetDemo()">Reset</button>
    </aside>
  </main>
  <script src="../dist/lightdraw.min.js"></script>
  <script>
    let app = LightDraw.createApp('#app', {
      width: 760, height: 480, background: '#1e293b', renderer: 'html', highContrast: false,
    });

    function resetDemo() {
      app.destroy();
      app = LightDraw.createApp('#app', {
        width: 760, height: 480, background: '#1e293b', renderer: 'html',
        highContrast: app.isHighContrast?.() ?? false,
      });
      buildScene();
    }

    function toggleContrast() {
      app.setHighContrast(!app.isHighContrast());
    }

    function buildScene() {
      const btn = LightDraw.createComponentFromJSON?.('button', { label: 'Activate', x: 40, y: 40 }, app)
        || app.group({ focusable: true, role: 'button', metadata: { label: 'Activate', componentType: 'button' }, x: 40, y: 40, listening: true });
      if (!btn.children?.length) {
        btn.add(app.roundedRect({ width: 120, height: 36, cornerRadius: 6, fill: '#2563eb' }));
        btn.add(app.text({ text: 'Activate', x: 28, y: 10, fill: '#fff', fontSize: 14 }));
      }
      btn.on('click', () => alert('Button activated via click or keyboard!'));

      const check = app.group({
        x: 40, y: 100, focusable: true, role: 'checkbox', ariaChecked: false,
        metadata: { componentType: 'checkbox', label: 'Enable feature' }, listening: true,
      });
      check.add(app.roundedRect({ width: 18, height: 18, cornerRadius: 3, fill: '#fff', stroke: '#9ca3af' }));
      check.add(app.text({ text: 'Enable feature', x: 26, y: 1, fill: '#e2e8f0', fontSize: 14 }));
      check.on('click', () => {
        check.ariaChecked = !check.ariaChecked;
        check.markDirty();
        app.requestRender();
      });

      const dropZone = app.roundedRect({
        x: 480, y: 160, width: 180, height: 120, cornerRadius: 8,
        fill: '#065f46', stroke: '#34d399', strokeWidth: 2, dropTarget: true, listening: true,
        name: 'Drop zone',
      });
      const chip = app.roundedRect({
        x: 80, y: 280, width: 56, height: 32, cornerRadius: 6,
        fill: '#2563eb', draggable: true, dragPayload: { type: 'chip' }, listening: true,
        name: 'Draggable chip',
      });

      dropZone.on('drop', (e) => {
        chip.x = dropZone.x + 60;
        chip.y = dropZone.y + 44;
        chip.markDirty();
        app.requestRender();
      });

      app.add(btn, check, dropZone, chip);
    }

    buildScene();
  </script>
</body>
</html>
