<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LightDraw — Accessibility</title>
  <script src="demo-embed.js"></script>
  <link rel="stylesheet" href="demo-common.css">
  <link rel="stylesheet" href="../dist/lightdraw.min.css">
</head>
<body>
  <div class="demo-shell">
    <header class="demo-header">
      <span class="demo-badge">Accessibility</span>
      <h1>Keyboard &amp; ARIA</h1>
      <p>Focus management, roles, drag-and-drop targets, and high-contrast rendering.</p>
    </header>
    <main class="demo-main demo-layout-aside">
      <div class="demo-canvas-wrap">
        <div id="app"></div>
      </div>
      <aside class="demo-aside-panel">
        <p>Use <kbd>Tab</kbd> / <kbd>Shift+Tab</kbd> to move focus.<br>
           <kbd>Enter</kbd> or <kbd>Space</kbd> activates buttons.<br>
           Drag the blue chip onto the green zone.</p>
        <button type="button" class="demo-btn" onclick="toggleContrast()">Toggle High Contrast</button>
        <button type="button" class="demo-btn secondary" onclick="resetDemo()">Reset</button>
        <p class="demo-aside-hint">HTML renderer · focus rings from lightdraw.min.css</p>
      </aside>
    </main>
  </div>
  <script src="../dist/lightdraw.min.js"></script>
  <script>
    let app = LightDraw.createApp('#app', {
      width: 720,
      height: 440,
      background: '#0d1322',
      renderer: 'html',
      highContrast: false,
    });

    function resetDemo() {
      const hc = app.isHighContrast?.() ?? false;
      app.destroy();
      app = LightDraw.createApp('#app', {
        width: 720,
        height: 440,
        background: '#0d1322',
        renderer: 'html',
        highContrast: hc,
      });
      buildScene();
    }

    function toggleContrast() {
      app.setHighContrast(!app.isHighContrast());
    }

    function buildScene() {
      const btn =
        LightDraw.createComponentFromJSON?.('button', { label: 'Activate', x: 40, y: 40 }, app) ||
        app.group({
          focusable: true,
          role: 'button',
          metadata: { label: 'Activate', componentType: 'button' },
          x: 40,
          y: 40,
          listening: true,
        });
      if (!btn.children?.length) {
        btn.add(app.roundedRect({ width: 120, height: 36, cornerRadius: 8, fill: '#2563eb' }));
        btn.add(app.text({ text: 'Activate', x: 0, y: 11, fill: '#fff', fontSize: 14, textAlign: 'center' }));
      }
      btn.on('click', () => alert('Button activated via click or keyboard!'));

      const check = app.group({
        x: 40,
        y: 100,
        focusable: true,
        role: 'checkbox',
        ariaChecked: false,
        metadata: { componentType: 'checkbox', label: 'Enable feature' },
        listening: true,
      });
      check.add(app.roundedRect({ width: 18, height: 18, cornerRadius: 3, fill: '#fff', stroke: '#9ca3af' }));
      check.add(app.text({ text: 'Enable feature', x: 26, y: 1, fill: '#e2e8f0', fontSize: 14 }));
      check.on('click', () => {
        check.ariaChecked = !check.ariaChecked;
        check.markDirty();
        app.requestRender();
      });

      const dropZone = app.roundedRect({
        x: 460,
        y: 140,
        width: 180,
        height: 120,
        cornerRadius: 8,
        fill: '#065f46',
        stroke: '#34d399',
        strokeWidth: 2,
        dropTarget: true,
        listening: true,
        name: 'Drop zone',
      });
      const chip = app.roundedRect({
        x: 80,
        y: 260,
        width: 56,
        height: 32,
        cornerRadius: 6,
        fill: '#2563eb',
        draggable: true,
        dragPayload: { type: 'chip' },
        listening: true,
        name: 'Draggable chip',
      });

      dropZone.on('drop', () => {
        chip.x = dropZone.x + 60;
        chip.y = dropZone.y + 44;
        chip.markDirty();
        app.requestRender();
      });

      app.add(btn, check, dropZone, chip);
    }

    buildScene();
  </script>
</body>
</html>
