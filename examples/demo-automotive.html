<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LightDraw — Automotive Cluster</title>
  <script src="demo-embed.js"></script>
  <link rel="stylesheet" href="demo-common.css">
  <link rel="stylesheet" href="../dist/lightdraw.min.css">
</head>
<body>
  <div class="demo-shell">
    <header class="demo-header">
      <span class="demo-badge">Automotive Module</span>
      <h1>Digital Instrument Cluster</h1>
      <p>Live cockpit with speed, RPM, ADAS lamps, and an <strong>incoming-call overlay</strong> between the primary gauges — plus a <strong>160-widget</strong> automotive catalog. Edit Scene JSON below for live updates.</p>
    </header>
    <main class="demo-main">
      <div class="demo-view-tabs" id="view-tabs">
        <button type="button" class="demo-btn is-active" data-view="cluster">Instrument cluster</button>
        <button type="button" class="demo-btn secondary" data-view="widgets">Widget catalog (160)</button>
      </div>
      <div id="view-cluster">
        <div class="demo-toolbar cluster-toolbar">
          <div class="cluster-toolbar-group">
            <button class="demo-btn" id="btn-drive" onclick="toggleDrive()">Start drive simulation</button>
            <button class="demo-btn secondary" onclick="randomFrame()">Random frame</button>
            <button class="demo-btn secondary" id="btn-call" onclick="toggleIncomingCall()">Dismiss call</button>
          </div>
          <label class="demo-label">Theme
            <select class="demo-select" id="theme" onchange="setTheme(this.value)">
              <option value="classic">Classic</option>
              <option value="sport">Sport</option>
              <option value="digital">Digital</option>
            </select>
          </label>
        </div>
        <div class="cluster-status" id="cluster-status" aria-live="polite">
          <span class="cluster-status-dot is-active" id="call-dot"></span>
          <span id="cluster-status-text">Incoming call · Alex Morgan · Mobile</span>
        </div>
        <div class="demo-canvas-wrap cluster-canvas-wrap">
          <div id="app"></div>
        </div>
      </div>
      <div class="chart-catalog-wrap" id="view-widgets" hidden>
        <div class="demo-toolbar">
          <input type="search" id="widget-search" placeholder="Filter widgets…" aria-label="Filter widgets">
          <span class="chart-count" id="widget-count"></span>
        </div>
        <div class="chart-gallery" id="widget-gallery"></div>
      </div>
    </main>
  </div>
  <script src="../dist/lightdraw.min.js"></script>
  <script src="demo-live-playground.js"></script>
  <script src="demo-auto-catalog.js"></script>
  <script>
    const isEmbed = () => document.documentElement.classList.contains('demo-embed');

    let driveTimer = null;
    let frameIndex = 0;
    let cluster = null;
    let lastAuthorScene = null;
    let playgroundMounted = false;
    let incomingCallActive = true;
    const frames = LightDraw.sampleDriveFrames ? LightDraw.sampleDriveFrames(120) : [];

    const CALL_DEMO = {
      caller: 'Alex Morgan',
      subtitle: 'Mobile',
      callStatus: 'incoming',
      callHint: 'Swipe to answer',
    };

    /** Design aspect for the cluster cockpit (~920×420). Avoid filling a short/wide wrap. */
    const CLUSTER_ASPECT = 920 / 420;

    const clusterApp = LightDraw.createApp('#app', {
      width: 920,
      height: 420,
      background: '#0a0a0a',
      renderer: 'canvas',
      autoResize: false,
    });

    const widgetMounts = [];
    let lastClusterSize = { w: 0, h: 0 };
    let clusterResizeTimer = 0;
    let clusterQuietUntil = 0;

    /** Fit a cockpit-shaped rect inside the demo wrap (letterbox, never stretch). */
    function clusterWrapSize() {
      const wrap = document.querySelector('#view-cluster .demo-canvas-wrap');
      if (!wrap) return { w: 920, h: 420 };
      const pad = 8;
      const availW = Math.max(280, Math.floor(wrap.clientWidth - pad));
      const availH = Math.max(200, Math.floor(wrap.clientHeight - pad));
      let w = availW;
      let h = Math.round(w / CLUSTER_ASPECT);
      if (h > availH) {
        h = availH;
        w = Math.round(h * CLUSTER_ASPECT);
      }
      w = Math.max(560, Math.min(w, availW));
      h = Math.round(w / CLUSTER_ASPECT);
      if (h > availH) {
        h = Math.max(240, availH);
        w = Math.min(availW, Math.round(h * CLUSTER_ASPECT));
      }
      return { w: Math.floor(w), h: Math.floor(h) };
    }

    function applyClusterCanvasSize(w, h) {
      const size = clusterApp.getSize?.() ?? { width: 0, height: 0 };
      if (Math.abs(size.width - w) < 2 && Math.abs(size.height - h) < 2) return;
      clusterQuietUntil = Date.now() + 280;
      const appEl = document.getElementById('app');
      if (appEl) {
        appEl.style.width = `${w}px`;
        appEl.style.height = `${h}px`;
        appEl.style.flex = '0 0 auto';
      }
      clusterApp.resize(w, h);
    }

    function syncCallChrome() {
      const dot = document.getElementById('call-dot');
      const text = document.getElementById('cluster-status-text');
      const btn = document.getElementById('btn-call');
      if (dot) dot.classList.toggle('is-active', incomingCallActive);
      if (text) {
        text.textContent = incomingCallActive
          ? `Incoming call · ${CALL_DEMO.caller} · ${CALL_DEMO.subtitle}`
          : 'No active calls';
      }
      if (btn) btn.textContent = incomingCallActive ? 'Dismiss call' : 'Simulate incoming call';
    }

    function mountClusterPlayground() {
      if (playgroundMounted || !window.LivePlayground) return;
      playgroundMounted = true;
      LivePlayground.mount({
        app: () => clusterApp,
        panes: ['scene', 'snippet'],
        getScene: () => lastAuthorScene,
        applyScene(parsed) {
          const { w, h } = clusterWrapSize();
          if (w < 100 || h < 100) return;
          lastClusterSize = { w, h };
          applyClusterCanvasSize(w, h);
          const base = parsed && typeof parsed === 'object' ? parsed : {};
          const props = { ...(base.props || {}), width: w, height: h, x: 0, y: 0 };
          const scene = { ...base, type: base.type || 'instrumentCluster', props };
          clusterApp.clear();
          clusterApp.loadJSON(scene);
          lastAuthorScene = scene;
          cluster = clusterApp.stage.children[0];
          incomingCallActive = !!(props.incomingCall || props.showCall);
          clusterApp.render();
          syncCallChrome();
        },
      });
    }

    function loadCluster(theme) {
      const { w, h } = clusterWrapSize();
      if (w < 100 || h < 100) return;
      lastClusterSize = { w, h };
      applyClusterCanvasSize(w, h);
      const scene = {
        type: 'instrumentCluster',
        props: {
          theme,
          width: w,
          height: h,
          x: 0,
          y: 0,
          speed: 0,
          rpm: 800,
          fuel: 75,
          engineTemp: 85,
          batteryVoltage: 12.4,
          tpms: [32, 32, 32, 32],
          gear: 'P',
          parkingBrake: true,
          incomingCall: incomingCallActive,
          ...CALL_DEMO,
        },
      };
      lastAuthorScene = scene;
      clusterApp.loadJSON(scene);
      cluster = clusterApp.stage.children[0];
      clusterApp.render();
      syncCallChrome();
      if (window.LivePlayground) LivePlayground.syncScene(true);
    }

    function toggleIncomingCall() {
      incomingCallActive = !incomingCallActive;
      if (!cluster) {
        syncCallChrome();
        return;
      }
      if (LightDraw.updateAutoWidgetProps) {
        LightDraw.updateAutoWidgetProps(cluster, {
          incomingCall: incomingCallActive,
          ...CALL_DEMO,
          callStatus: incomingCallActive ? 'incoming' : 'ended',
        });
      }
      clusterApp.render();
      syncCallChrome();
    }

    function syncClusterSize() {
      if (Date.now() < clusterQuietUntil) return;
      if (document.getElementById('view-cluster')?.hidden) return;
      const { w, h } = clusterWrapSize();
      if (w < 100 || h < 100) return;
      if (Math.abs(lastClusterSize.w - w) < 3 && Math.abs(lastClusterSize.h - h) < 3) return;
      lastClusterSize = { w, h };

      const theme = document.getElementById('theme')?.value || 'classic';
      if (!cluster) {
        loadCluster(theme);
        return;
      }

      applyClusterCanvasSize(w, h);
      if (LightDraw.updateAutoWidgetProps) {
        LightDraw.updateAutoWidgetProps(cluster, { width: w, height: h });
      }
      if (lastAuthorScene && lastAuthorScene.props) {
        lastAuthorScene = {
          ...lastAuthorScene,
          props: { ...lastAuthorScene.props, width: w, height: h },
        };
        if (window.LivePlayground) LivePlayground.syncScene(false);
      }
      clusterApp.render();
    }

    function scheduleClusterResize() {
      if (Date.now() < clusterQuietUntil) return;
      clearTimeout(clusterResizeTimer);
      clusterResizeTimer = setTimeout(syncClusterSize, 200);
    }

    function initClusterLayoutWatch() {
      const wrap = document.querySelector('#view-cluster .demo-canvas-wrap');
      if (!wrap) return;

      const bootCluster = () => {
        // Dock first so remaining height is final, then one cluster paint
        mountClusterPlayground();
        clusterQuietUntil = Date.now() + 400;
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            const theme = document.getElementById('theme')?.value || 'classic';
            if (!cluster) loadCluster(theme);
          });
        });
      };

      if (typeof ResizeObserver !== 'undefined') {
        const ro = new ResizeObserver(() => {
          if (!cluster) return;
          scheduleClusterResize();
        });
        ro.observe(wrap);
      }

      window.addEventListener('resize', scheduleClusterResize);

      const start = () => setTimeout(bootCluster, 50);
      if (document.readyState === 'complete') start();
      else window.addEventListener('load', start, { once: true });
    }

    initClusterLayoutWatch();

    function applyFrame(state) {
      if (!cluster || !LightDraw.applyDriveState) return;
      if (state.incomingCall !== undefined && state.incomingCall !== incomingCallActive) {
        incomingCallActive = !!state.incomingCall;
        syncCallChrome();
      }
      LightDraw.applyDriveState(cluster, state);
    }

    function toggleDrive() {
      const btn = document.getElementById('btn-drive');
      if (driveTimer) {
        clearInterval(driveTimer);
        driveTimer = null;
        if (btn) btn.textContent = 'Start drive simulation';
        return;
      }
      if (btn) btn.textContent = 'Stop drive simulation';
      driveTimer = setInterval(() => {
        if (!frames.length) return;
        applyFrame(frames[frameIndex % frames.length]);
        frameIndex++;
      }, 100);
    }

    function randomFrame() {
      applyFrame({
        speed: Math.round(Math.random() * 140),
        rpm: Math.round(1000 + Math.random() * 5000),
        fuel: Math.round(Math.random() * 100),
        engineTemp: Math.round(70 + Math.random() * 50),
        batteryVoltage: Math.round((11.5 + Math.random() * 1.5) * 10) / 10,
        tpms: [28, 30, 22, 31].map(() => Math.round(20 + Math.random() * 15)),
        parkingBrake: Math.random() > 0.7,
        headlights: Math.random() > 0.5,
        cruiseSpeed: Math.random() > 0.6 ? 65 : 0,
        gear: ['P', 'R', 'N', 'D'][Math.floor(Math.random() * 4)],
        turnLeft: Math.random() > 0.8,
        turnRight: Math.random() > 0.8,
        signals: {
          'engine.rpm': Math.round(Math.random() * 6000),
          'vehicle.speed': Math.round(Math.random() * 120),
          'battery.voltage': 12.4,
        },
      });
    }

    function setTheme(theme) {
      const wasRunning = !!driveTimer;
      if (driveTimer) clearInterval(driveTimer);
      driveTimer = null;
      const btn = document.getElementById('btn-drive');
      if (btn) btn.textContent = 'Start drive simulation';
      loadCluster(theme);
      if (wasRunning) toggleDrive();
    }

    syncCallChrome();

    function destroyWidgetGallery() {
      widgetMounts.forEach((m) => m.destroy());
      widgetMounts.length = 0;
      const gallery = document.getElementById('widget-gallery');
      if (gallery) gallery.innerHTML = '';
    }

    /** Keep gallery previews on a readable aspect (no flat strip / oval dials). */
    function galleryFitSize(type, cw, ch) {
      const availW = Math.max(120, Math.floor(cw));
      const availH = Math.max(80, Math.floor(ch));
      if (type === 'instrumentCluster' || type === 'digitalInstrumentCluster') {
        const aspect = CLUSTER_ASPECT;
        let w = availW;
        let h = Math.round(w / aspect);
        if (h > availH) {
          h = availH;
          w = Math.round(h * aspect);
        }
        return { w: Math.max(200, w), h: Math.max(100, h) };
      }
      if (
        type === 'speedometer' ||
        type === 'tachometer' ||
        type === 'turboBoostGauge' ||
        type === 'torqueMeter' ||
        type === 'horsepowerMeter' ||
        type === 'engineTemp' ||
        type === 'gForceMeter'
      ) {
        const s = Math.min(availW, availH);
        return { w: s, h: s };
      }
      if (type === 'tpms' || type === 'tirePressureMonitoring') {
        const aspect = 1.7;
        let w = availW;
        let h = Math.round(w / aspect);
        if (h > availH || h < 72) {
          h = Math.max(72, Math.min(availH, Math.round(availW / aspect)));
          w = Math.min(availW, Math.round(h * aspect));
        }
        return { w, h };
      }
      return { w: availW, h: availH };
    }

    function mountAutoWidget(type, container) {
      let app = null;
      let root = null;
      let layoutRo = null;
      let lastMount = { w: 0, h: 0 };

      const init = () => {
        const cw = Math.max(container.clientWidth, 120);
        const ch = Math.max(container.clientHeight, 80);
        if (cw < 8 || ch < 8) return;
        const { w, h } = galleryFitSize(type, cw, ch);
        if (app) {
          if (Math.abs(lastMount.w - w) < 4 && Math.abs(lastMount.h - h) < 4) return;
          lastMount = { w, h };
          if (root && LightDraw.updateAutoWidgetProps) {
            LightDraw.updateAutoWidgetProps(root, { width: w, height: h });
          }
          app.resize(w, h);
          app.render();
          return;
        }

        lastMount = { w, h };
        const props = window.ldAutoProps(type, w, h);
        app = LightDraw.createApp(container, {
          renderer: 'html',
          width: w,
          height: h,
          background: '#0a0a0a',
          autoResize: false,
        });
        root = app.loadJSON({ type, props: { ...props, x: 0, y: 0 } });
        app.render();
      };

      layoutRo = typeof ResizeObserver !== 'undefined'
        ? new ResizeObserver(() => requestAnimationFrame(init))
        : null;
      layoutRo?.observe(container);
      requestAnimationFrame(init);

      const mount = {
        type,
        destroy: () => {
          layoutRo?.disconnect();
          app?.destroy();
          app = null;
          root = null;
        },
      };
      widgetMounts.push(mount);
      return mount;
    }

    function buildWidgetGallery(filter = '') {
      const gallery = document.getElementById('widget-gallery');
      if (!gallery) return;
      if (typeof window.syncAutoCatalog === 'function') window.syncAutoCatalog();
      const catalog = window.LD_AUTO_WIDGET_CATALOG || [];
      const q = filter.trim().toLowerCase();
      const types = catalog.filter((t) => !q || t.toLowerCase().includes(q));
      const countEl = document.getElementById('widget-count');
      if (countEl) {
        countEl.textContent = `${types.length} widget${types.length === 1 ? '' : 's'}`;
      }

      destroyWidgetGallery();

      let i = 0;
      const batch = 6;
      function renderBatch() {
        const slice = types.slice(i, i + batch);
        if (!slice.length) return;
        slice.forEach((type) => {
          const card = document.createElement('div');
          card.className = 'chart-card';
          card.innerHTML = `
            <div class="chart-card-head">
              <h3>${type}</h3>
            </div>
            <div class="mini-canvas"></div>`;
          gallery.appendChild(card);
          try {
            mountAutoWidget(type, card.querySelector('.mini-canvas'));
          } catch (err) {
            console.warn('Widget failed:', type, err);
            card.querySelector('.mini-canvas').innerHTML =
              `<p style="color:#94a3b8;font-size:12px;padding:8px">${type}</p>`;
          }
        });
        i += batch;
        if (i < types.length) requestAnimationFrame(renderBatch);
      }
      renderBatch();
    }

    function setView(view) {
      const clusterView = document.getElementById('view-cluster');
      const widgetsView = document.getElementById('view-widgets');
      const isCluster = view === 'cluster';
      clusterView.hidden = !isCluster;
      widgetsView.hidden = isCluster;
      document.querySelectorAll('#view-tabs [data-view]').forEach((btn) => {
        btn.classList.toggle('is-active', btn.dataset.view === view);
        btn.classList.toggle('secondary', btn.dataset.view !== view);
      });
      if (!isCluster) buildWidgetGallery(document.getElementById('widget-search')?.value || '');
      else scheduleClusterResize();
      if (!isEmbed()) {
        const url = new URL(location.href);
        if (view === 'widgets') url.hash = 'widgets';
        else url.hash = '';
        history.replaceState(null, '', url);
      }
    }

    document.getElementById('view-tabs').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-view]');
      if (btn) setView(btn.dataset.view);
    });

    document.getElementById('widget-search').addEventListener('input', (e) => {
      buildWidgetGallery(e.target.value);
    });

    if (location.hash === '#widgets' && !isEmbed()) {
      setView('widgets');
    }
  </script>
</body>
</html>
